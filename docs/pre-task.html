<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment - Pre-Reading Task</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBd4MI5xzSE4QYIjxe_DlBKnuuv-aiS3nk",
            authDomain: "study-ug-osu.firebaseapp.com",
            projectId: "study-ug-osu",
            storageBucket: "study-ug-osu.firebasestorage.app",
            messagingSenderId: "115284332881",
            appId: "1:115284332881:web:351ebb762bad162fccc370"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function PreTask() {
            // Get participant info from URL
            const urlParams = new URLSearchParams(window.location.search);
            const participantId = urlParams.get('participantId');
            const experimentId = urlParams.get('experimentId');
            const condition = urlParams.get('condition') || 'without_llm';
            const paper = urlParams.get('paper') || 'mroz2018';
            const mode = urlParams.get('mode') || 'experiment';

            // Pre-task responses - Strategies (multiple fields)
            const [strategies, setStrategies] = useState(['']);
            const [confidence, setConfidence] = useState('');

            // Add new strategy field
            const addStrategyField = () => {
                if (strategies.length < 10) {
                    setStrategies([...strategies, '']);
                }
            };

            // Update strategy at index
            const updateStrategy = (index, value) => {
                const newStrategies = [...strategies];
                newStrategies[index] = value;
                setStrategies(newStrategies);
            };

            // Remove strategy at index
            const removeStrategy = (index) => {
                if (strategies.length > 1) {
                    const newStrategies = strategies.filter((_, i) => i !== index);
                    setStrategies(newStrategies);
                }
            };

            // Get non-empty strategies
            const getFilledStrategies = () => {
                return strategies.filter(s => s.trim().length > 0);
            };

            // Overall approach clarity
            const [approachClarity, setApproachClarity] = useState('');

            // Challenges
            const [challenges, setChallenges] = useState('');

            // Loading state
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                if (!participantId || !experimentId) {
                    alert('Missing participant information. Please start from the beginning.');
                    window.location.href = 'index.html';
                }
            }, [participantId, experimentId]);

            // Word count helper
            const countWords = (text) => {
                return text.trim().split(/\s+/).filter(word => word.length > 0).length;
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (isSubmitting) return;

                // Validate strategies (at least 1 non-empty)
                const filledStrategies = getFilledStrategies();
                if (filledStrategies.length === 0) {
                    alert('Please enter at least one strategy.');
                    return;
                }
                if (!confidence) {
                    alert('Please rate your confidence.');
                    return;
                }

                // Validate approach clarity
                if (!approachClarity) {
                    alert('Please rate your approach clarity.');
                    return;
                }

                setIsSubmitting(true);

                const preTaskData = {
                    strategies: filledStrategies,
                    confidence: parseInt(confidence),
                    approachClarity: parseInt(approachClarity),
                    challenges: challenges.trim(),
                    completedAt: new Date().toISOString()
                };

                try {
                    if (!experimentId) {
                        throw new Error('Missing experimentId');
                    }
                    if (!participantId) {
                        throw new Error('Missing participantId');
                    }

                    console.log('💾 Pre-task data:', preTaskData);

                    // Firebase saving disabled
                    /*
                    console.log('💾 Saving pre-task to:', `users/${participantId}/experiments/${experimentId}`);

                    // Save to users/{participantId}/experiments/{experimentId}
                    const experimentRef = db.collection('users').doc(participantId).collection('experiments').doc(experimentId);
                    await experimentRef.set({
                        participantId,
                        experimentId,
                        condition,
                        paper,
                        mode,
                        preTask: preTaskData,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    }, { merge: true });

                    console.log('✅ Pre-task saved successfully');
                    */

                    // Navigate to main experiment
                    const params = new URLSearchParams({
                        participantId,
                        experimentId,
                        mode,
                        condition,
                        paper
                    });
                    window.location.href = `reading.html?${params.toString()}`;

                } catch (error) {
                    console.error('Error saving pre-task:', error);
                    alert('Failed to save. Please try again.');
                    setIsSubmitting(false);
                }
            };

            if (!participantId) {
                return (
                    <div className="min-h-screen flex items-center justify-center">
                        <p>Loading...</p>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 py-8 px-4">
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            {/* Header */}
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">💭</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Pre-Reading Task</h1>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-16">
                                {/* Context - Main Instruction */}
                                <div className="bg-amber-100 border-2 border-amber-400 p-6 rounded-xl">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Please recall a recent meeting you led at work.</h2>
                                    <p className="text-gray-600">Think about a specific meeting where you were responsible for organizing or facilitating.</p>
                                </div>

                                {/* Q1: Meeting Strategies */}
                                <div>
                                    <label className="block text-base font-bold text-gray-800 mb-3">
                                        Q1. Please list the specific strategies you used to make this meeting more effective. *
                                    </label>
                                    <p className="text-sm text-gray-600 mb-4">Enter one strategy per field. Click "Add Strategy" to add more.</p>

                                    <div className="space-y-3">
                                        {strategies.map((strategy, index) => (
                                            <div key={index} className="flex items-center space-x-3">
                                                <span className="text-sm font-medium text-gray-500 w-6">{index + 1}.</span>
                                                <input
                                                    type="text"
                                                    value={strategy}
                                                    onChange={(e) => updateStrategy(index, e.target.value)}
                                                    className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                                                    placeholder={`Strategy ${index + 1}`}
                                                />
                                                {strategies.length > 1 && (
                                                    <button
                                                        type="button"
                                                        onClick={() => removeStrategy(index)}
                                                        className="px-3 py-2 text-red-500 hover:bg-red-50 rounded-lg transition-colors"
                                                        title="Remove"
                                                    >
                                                        ✕
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                    </div>

                                    {strategies.length < 10 && (
                                        <div className="flex items-center space-x-3 mt-3">
                                            <span className="w-6"></span>
                                            <button
                                                type="button"
                                                onClick={addStrategyField}
                                                className="px-4 py-2 text-amber-600 border border-amber-300 rounded-lg hover:bg-amber-50 transition-colors text-sm font-medium"
                                            >
                                                + Add Strategy
                                            </button>
                                        </div>
                                    )}

                                    <div className="mt-6">
                                        <label className="block text-sm font-bold text-gray-600 mb-2">
                                            How confident are you that these strategies improved the meeting's effectiveness? *
                                        </label>
                                        <div className="flex items-center justify-between">
                                            <span className="text-xs text-gray-500 w-24">Not at all confident</span>
                                            <div className="flex space-x-1">
                                                {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                    <button
                                                        key={value}
                                                        type="button"
                                                        onClick={() => setConfidence(value.toString())}
                                                        className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                            confidence === value.toString()
                                                                ? 'bg-amber-500 text-white'
                                                                : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                        }`}
                                                    >
                                                        {value}
                                                    </button>
                                                ))}
                                            </div>
                                            <span className="text-xs text-gray-500 w-24 text-right">Extremely confident</span>
                                        </div>
                                    </div>
                                </div>

                                {/* Q2: Approach Clarity */}
                                <div>
                                    <label className="block text-sm font-bold text-gray-800 mb-2">
                                        Q2. To what extent did you have a clear, intentional approach to running this meeting effectively? *
                                    </label>
                                    <div className="flex items-center justify-between mt-3">
                                        <span className="text-xs text-gray-500 w-24">No clear approach</span>
                                        <div className="flex space-x-1">
                                            {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                <button
                                                    key={value}
                                                    type="button"
                                                    onClick={() => setApproachClarity(value.toString())}
                                                    className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                        approachClarity === value.toString()
                                                            ? 'bg-amber-500 text-white'
                                                            : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                    }`}
                                                >
                                                    {value}
                                                </button>
                                            ))}
                                        </div>
                                        <span className="text-xs text-gray-500 w-24 text-right">Very clear and intentional</span>
                                    </div>
                                </div>

                                {/* Q3: Challenges */}
                                <div>
                                    <label className="block text-sm font-bold text-gray-800 mb-2">
                                        Q3. Please briefly describe any challenges or difficulties you experienced during this meeting. *
                                    </label>
                                    <textarea
                                        value={challenges}
                                        onChange={(e) => setChallenges(e.target.value)}
                                        className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-amber-500"
                                        rows="4"
                                        placeholder=""
                                        required
                                    />
                                </div>

                                {/* Submit */}
                                <div className="pt-6 border-t">
                                    <button
                                        type="submit"
                                        disabled={isSubmitting}
                                        className="w-full bg-amber-500 text-white py-3 px-6 rounded-lg hover:bg-amber-600 font-medium transition-colors text-lg disabled:bg-amber-300 disabled:cursor-not-allowed flex items-center justify-center"
                                    >
                                        {isSubmitting ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Saving...
                                            </>
                                        ) : (
                                            'Continue to Reading →'
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PreTask />, document.getElementById('root'));
    </script>

</body>
</html>
