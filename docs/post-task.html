<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment - Reflection Task</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="no-back.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBd4MI5xzSE4QYIjxe_DlBKnuuv-aiS3nk",
            authDomain: "study-ug-osu.firebaseapp.com",
            projectId: "study-ug-osu",
            storageBucket: "study-ug-osu.firebasestorage.app",
            messagingSenderId: "115284332881",
            appId: "1:115284332881:web:351ebb762bad162fccc370"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // One open question per CIMO element, one text box each. The wording mirrors
        // the CIMO rating items in the final survey, so the written reflection and the
        // self-report are about the same four things.
        const REFLECTION_ITEMS = [
            {
                key: 'context',
                label: 'Context',
                question: 'How do you currently manage your time, and how closely does your situation match the situation studied in this article?',
                placeholder: 'Describe how you manage your time now, and where your situation is similar to or different from the students in the study.'
            },
            {
                key: 'intervention',
                label: 'Intervention',
                question: 'What did the training in this article actually involve, and would it work in your situation?',
                placeholder: 'Describe the training described in the article, and whether you could apply it as-is or would need to change it.'
            },
            {
                key: 'mechanism',
                label: 'Mechanism',
                question: 'Why does this training work — what does it change — and would that hold for you as well?',
                placeholder: 'Explain what the training changes that leads to the effect, and whether the same would apply to you.'
            },
            {
                key: 'outcome',
                label: 'Outcome',
                question: 'What outcomes did the article report, and what outcomes would you expect if you applied it yourself?',
                placeholder: 'Describe the outcomes reported in the study, and what you would realistically expect in your own case.'
            }
        ];

        const MIN_CHARS = 30;

        function PostTask() {
            // Auth state
            const [currentUser, setCurrentUser] = useState(null);
            const [checkingAuth, setCheckingAuth] = useState(true);

            // Get session info from URL
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId') || sessionStorage.getItem('currentSessionId');
            const condition = urlParams.get('condition');
            const paper = urlParams.get('paper');
            const mode = urlParams.get('mode');

            const [responses, setResponses] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);

            // Auth guard
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (!user) {
                        window.location.href = 'login.html';
                        return;
                    }
                    setCurrentUser(user);
                    setCheckingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            const setResponse = (key, value) => {
                setResponses(prev => ({ ...prev, [key]: value }));
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (isSubmitting) return;

                const tooShortIdx = REFLECTION_ITEMS.findIndex(i => (responses[i.key] || '').trim().length < MIN_CHARS);
                if (tooShortIdx !== -1) {
                    alert(`Please write a little more for question ${tooShortIdx + 1} (at least ${MIN_CHARS} characters).`);
                    return;
                }

                setIsSubmitting(true);

                const reflection = Object.fromEntries(
                    REFLECTION_ITEMS.map(i => [i.key, (responses[i.key] || '').trim()])
                );
                const postTaskData = {
                    reflection,
                    completedAt: new Date().toISOString()
                };

                try {
                    if (!sessionId) {
                        throw new Error('Missing sessionId');
                    }

                    console.log('💾 Reflection data:', postTaskData);

                    const sessionRef = db.collection('users').doc(currentUser.uid).collection('sessions').doc(sessionId);
                    await sessionRef.set({
                        postTask: postTaskData,
                        currentPhase: 'quiz'
                    }, { merge: true });

                    console.log('✅ Reflection saved');

                    const params = new URLSearchParams({ sessionId, mode, condition, paper });
                    window.location.replace(`quiz.html?${params.toString()}`);

                } catch (error) {
                    console.error('Error saving reflection:', error);
                    alert('Failed to save. Please try again.');
                    setIsSubmitting(false);
                }
            };

            if (checkingAuth) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <svg className="animate-spin h-10 w-10 text-teal-600 mx-auto mb-4" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 py-8 px-4">
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">🎯</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Reflection Task</h1>
                                <p className="text-gray-600">Think about how this article applies to your own situation.</p>
                            </div>

                            <div className="bg-teal-50 border-2 border-teal-300 p-5 rounded-xl mb-8">
                                <p className="text-gray-700 text-sm">
                                    Answer each question in your own words. There are no right or wrong answers —
                                    write what you actually think. The article is no longer available, so answer
                                    from what you remember.
                                </p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-8">
                                {REFLECTION_ITEMS.map((item, idx) => {
                                    const value = responses[item.key] || '';
                                    return (
                                        <div key={item.key}>
                                            <div className="flex items-start space-x-3 mb-2">
                                                <span className="flex-shrink-0 w-7 h-7 bg-teal-600 text-white rounded-full flex items-center justify-center text-sm font-bold">
                                                    {idx + 1}
                                                </span>
                                                <div className="flex-1">
                                                    <label className="block text-base font-bold text-gray-800">
                                                        {item.question} *
                                                    </label>
                                                </div>
                                            </div>
                                            <textarea
                                                value={value}
                                                onChange={(e) => setResponse(item.key, e.target.value)}
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 text-sm"
                                                rows={6}
                                                placeholder={item.placeholder}
                                            />
                                            <p className="text-xs text-gray-400 mt-1 text-right">
                                                {value.trim().length} characters
                                            </p>
                                        </div>
                                    );
                                })}

                                <div className="flex justify-end pt-4 border-t">
                                    <button
                                        type="submit"
                                        disabled={isSubmitting}
                                        className="px-8 py-3 bg-teal-600 text-white font-semibold rounded-lg hover:bg-teal-700 transition-colors disabled:bg-teal-300 disabled:cursor-not-allowed flex items-center justify-center"
                                    >
                                        {isSubmitting ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Saving...
                                            </>
                                        ) : (
                                            'Next →'
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<PostTask />, document.getElementById('root'));
    </script>
</body>
</html>
