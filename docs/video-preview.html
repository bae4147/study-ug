<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Overview — preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<!--
  Internal. Plays a slideshow produced by scripts/generate-defaults.js so the
  result can be judged before it is promoted to the study. Each scene is one
  image plus its narration; the narration ending is what advances the slide, so
  what you hear here is what a participant would get.

  Open as  video-preview.html?src=papers/hafner2014/video.generated.json
-->
<body class="bg-gray-900 min-h-screen text-gray-100">
<div class="max-w-5xl mx-auto p-6">

    <div id="status" class="text-center text-gray-400 py-20">Loading…</div>

    <div id="player" class="hidden">
        <div class="flex items-baseline justify-between mb-3">
            <h1 id="title" class="text-xl font-bold"></h1>
            <span id="meta" class="text-sm text-gray-400"></span>
        </div>

        <div class="relative bg-black rounded-lg overflow-hidden shadow-2xl">
            <img id="slide" class="w-full block" alt="">
            <div id="caption" class="absolute bottom-0 left-0 right-0 bg-black/70 text-sm p-3 leading-snug"></div>
        </div>

        <div class="mt-3">
            <div class="h-1.5 bg-gray-700 rounded-full overflow-hidden">
                <div id="bar" class="h-full bg-orange-500 transition-[width] duration-200" style="width:0%"></div>
            </div>
            <div class="flex justify-between text-xs text-gray-400 mt-1">
                <span id="clock">0:00</span>
                <span id="counter"></span>
            </div>
        </div>

        <div class="flex items-center justify-center space-x-3 mt-4">
            <button id="prev" class="px-4 py-2 bg-gray-700 rounded-lg hover:bg-gray-600">← Prev</button>
            <button id="play" class="px-8 py-2 bg-orange-600 rounded-lg hover:bg-orange-500 font-medium">▶ Play</button>
            <button id="next" class="px-4 py-2 bg-gray-700 rounded-lg hover:bg-gray-600">Next →</button>
        </div>

        <details class="mt-8">
            <summary class="cursor-pointer text-sm text-gray-400 hover:text-gray-200">Narration script</summary>
            <ol id="script" class="mt-3 space-y-2 text-sm text-gray-300 list-decimal pl-6"></ol>
        </details>
    </div>

    <audio id="audio"></audio>
</div>

<script>
(function () {
    var params = new URLSearchParams(location.search);
    var src = params.get('src') || 'papers/hafner2014/video.generated.json';

    var el = function (id) { return document.getElementById(id); };
    var audio = el('audio');
    var scenes = [], idx = 0, playing = false, starts = [], total = 0;

    var fmt = function (s) {
        s = Math.max(0, Math.round(s));
        return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    };

    fetch(src)
        .then(function (r) { if (!r.ok) throw new Error(r.status + ' ' + src); return r.json(); })
        .then(function (d) {
            scenes = d.scenes || [];
            if (!scenes.length) throw new Error('no scenes in ' + src);

            // Scene durations come from the outline, but the narration audio is what
            // actually advances the slide, so these are only used for the progress bar.
            var t = 0;
            scenes.forEach(function (s) { starts.push(t); t += s.duration || 9; });
            total = t;

            el('title').textContent = d.title || 'Video overview';
            el('meta').textContent = scenes.length + ' scenes · ~' + fmt(total);
            scenes.forEach(function (s) {
                var li = document.createElement('li');
                li.textContent = s.narration || '';
                el('script').appendChild(li);
            });

            el('status').classList.add('hidden');
            el('player').classList.remove('hidden');
            show(0);
        })
        .catch(function (e) {
            el('status').innerHTML = 'Could not load <code class="text-orange-400">' + src +
                '</code><br><span class="text-sm">' + e.message +
                '</span><br><br><span class="text-sm text-gray-500">Generate it first with scripts/generate-defaults.js, and serve this page over http (not file://).</span>';
        });

    function show(i) {
        idx = Math.max(0, Math.min(i, scenes.length - 1));
        var s = scenes[idx];
        el('slide').src = 'data:image/png;base64,' + s.imageBase64;
        el('caption').textContent = s.narration || '';
        el('counter').textContent = 'Scene ' + (idx + 1) + ' / ' + scenes.length;
        el('clock').textContent = fmt(starts[idx]);
        el('bar').style.width = (total ? (starts[idx] / total) * 100 : 0) + '%';
        audio.src = 'data:audio/mpeg;base64,' + s.audioBase64;
        if (playing) audio.play();
    }

    audio.addEventListener('ended', function () {
        if (!playing) return;
        if (idx + 1 < scenes.length) { show(idx + 1); }
        else { playing = false; el('play').textContent = '▶ Play'; el('bar').style.width = '100%'; }
    });

    el('play').addEventListener('click', function () {
        playing = !playing;
        this.textContent = playing ? '⏸ Pause' : '▶ Play';
        if (playing) audio.play(); else audio.pause();
    });
    el('prev').addEventListener('click', function () { show(idx - 1); });
    el('next').addEventListener('click', function () { show(idx + 1); });
})();
</script>
</body>
</html>
