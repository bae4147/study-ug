<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment - Complete</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="no-back.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBd4MI5xzSE4QYIjxe_DlBKnuuv-aiS3nk",
            authDomain: "study-ug-osu.firebaseapp.com",
            projectId: "study-ug-osu",
            storageBucket: "study-ug-osu.firebasestorage.app",
            messagingSenderId: "115284332881",
            appId: "1:115284332881:web:351ebb762bad162fccc370"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Cloud Function endpoint for sending completion email
        const SEND_EMAIL_URL = 'https://us-central1-study-ug-osu.cloudfunctions.net/sendCompletionEmail';

        function CompletePage() {
            const [currentUser, setCurrentUser] = useState(null);
            const [checkingAuth, setCheckingAuth] = useState(true);
            const [sessionCompleted, setSessionCompleted] = useState(false);
            const [emailStatus, setEmailStatus] = useState('pending'); // pending, sending, sent, error

            // Get session info from URL
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId') || sessionStorage.getItem('currentSessionId');

            // Send completion email
            const sendCompletionEmail = async (uid, sid) => {
                setEmailStatus('sending');
                try {
                    const response = await fetch(SEND_EMAIL_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uid, sessionId: sid })
                    });

                    if (response.ok) {
                        setEmailStatus('sent');
                        console.log('✅ Completion email sent');
                    } else {
                        const error = await response.json();
                        console.error('Email sending failed:', error);
                        setEmailStatus('error');
                    }
                } catch (err) {
                    console.error('Email sending error:', err);
                    setEmailStatus('error');
                }
            };

            // Auth guard and mark session complete
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (user) => {
                    if (!user) {
                        window.location.href = 'login.html';
                        return;
                    }
                    setCurrentUser(user);

                    // Mark session as complete if not already
                    if (sessionId) {
                        try {
                            const sessionRef = db.collection('users').doc(user.uid).collection('sessions').doc(sessionId);
                            await sessionRef.set({
                                currentPhase: 'complete',
                                completedAt: firebase.firestore.FieldValue.serverTimestamp()
                            }, { merge: true });
                            console.log('✅ Session marked as complete');
                            setSessionCompleted(true);

                            // Send completion email with student's responses
                            sendCompletionEmail(user.uid, sessionId);

                            // Clear sessionStorage
                            sessionStorage.removeItem('currentSessionId');
                            sessionStorage.removeItem('hasCustomPdf');
                            sessionStorage.removeItem('customPaperTitle');
                            sessionStorage.removeItem('paperMetadata');
                            sessionStorage.removeItem('currentPaperId');
                            sessionStorage.removeItem('generationStatus');
                        } catch (err) {
                            console.error('Error marking session complete:', err);
                        }
                    }

                    setCheckingAuth(false);
                });
                return () => unsubscribe();
            }, [sessionId]);

            const handleLogout = async () => {
                await auth.signOut();
                window.location.href = 'login.html';
            };

            if (checkingAuth) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center">
                        <div className="text-center">
                            <svg className="animate-spin h-10 w-10 text-green-600 mx-auto mb-4" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 flex items-center justify-center py-8 px-4">
                    <div className="max-w-2xl mx-auto text-center">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            <div className="text-6xl mb-6">🎉</div>
                            <h1 className="text-3xl font-bold text-gray-800 mb-4">You're All Set!</h1>
                            <p className="text-lg text-gray-600 mb-4">
                                You have successfully completed the assignment.
                            </p>

                            {/* Email Status */}
                            <div className="mb-6">
                                {emailStatus === 'sending' && (
                                    <div className="flex items-center justify-center space-x-2 text-blue-600">
                                        <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                        <span>Sending confirmation email…</span>
                                    </div>
                                )}
                                {emailStatus === 'sent' && (
                                    <div className="bg-green-50 border border-green-200 rounded-lg p-3 text-green-700">
                                        ✉️ A confirmation email has been sent to you.
                                    </div>
                                )}
                                {emailStatus === 'error' && (
                                    <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-yellow-700 text-sm">
                                        ⚠️ Could not send the confirmation email. Your responses are still saved.
                                    </div>
                                )}
                            </div>

                            <p className="text-gray-700 text-base font-semibold mb-6">
                                You may now close this window.
                            </p>

                            <div className="space-y-3 pt-4 border-t">
                                <button
                                    onClick={handleLogout}
                                    className="w-full px-6 py-2 text-gray-500 hover:text-gray-700 text-sm"
                                >
                                    Sign Out
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<CompletePage />, document.getElementById('root'));
    </script>
</body>
</html>
