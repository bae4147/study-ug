                                            </div>
                                        ) : isCustomPdf ? (
                                            /* PDF failed to load - show error message */
                                            <div className="w-full h-full flex items-center justify-center" style={{ minHeight: 'calc(100vh - 120px)' }}>
                                                <div className="text-center max-w-md p-8">
                                                    <div className="text-6xl mb-4">📄</div>
                                                    <h3 className="text-xl font-bold text-gray-800 mb-3">Unable to load PDF</h3>
                                                    <div className="text-left bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
                                                        <p className="text-sm text-gray-700 mb-2"><strong>Please try the following:</strong></p>
                                                        <ol className="text-sm text-gray-600 list-decimal list-inside space-y-1">
                                                            <li>Refresh the page (Ctrl+R or Cmd+R)</li>
                                                            <li>Use a different browser (Chrome recommended)</li>
                                                            <li>Start over (re-upload PDF from index page)</li>
                                                        </ol>
                                                    </div>
                                                    <p className="text-sm text-gray-500">
                                                        If the problem persists, please contact:<br/>
                                                        <a href="mailto:sh.bae@snu.ac.kr" className="text-blue-600 hover:underline font-medium">sh.bae@snu.ac.kr</a>
                                                    </p>
                                                </div>
                                            </div>
                                        ) : (
                                            /* Standard HTML paper content */
                                            <div className="w-full max-w-[900px] mx-auto p-12">
                                                <div
                                                    id="paper-content"
                                                    className="prose max-w-none"
                                                    dangerouslySetInnerHTML={{ __html: paperContent || '<p>Loading paper...</p>' }}
                                                />
                                            </div>
                                        )
                                    )}
                                </div>
                            </div>

                            {/* Resizable Divider */}
                            {showRightPanel && (
                                <div
                                    onMouseDown={handleResizeStart}
                                    className={`absolute top-0 bottom-0 w-2 bg-gray-200 hover:bg-purple-400 cursor-col-resize transition-colors z-10 ${
                                        isResizing ? 'bg-purple-500' : ''
                                    }`}
                                    style={{ left: `calc(${leftPanelWidth}% - 4px)`, touchAction: 'none' }}
                                >
                                    <div className="h-full flex items-center justify-center">
                                        <div className="w-1 h-8 bg-gray-400 rounded-full opacity-50"></div>
                                    </div>
                                </div>
                            )}

                            {/* Right Panel - Chat / Resources (for with_llm conditions only) */}
                            {showRightPanel && (
                                <div
                                    className={`bg-white flex flex-col overflow-hidden absolute top-0 bottom-0 right-0 ${
                                        activeFocus !== 'reading' ? 'border-4 border-purple-500' : 'border-4 border-transparent'
                                    }`}
                                    style={{ width: `calc(${100 - leftPanelWidth}% - 4px)` }}
                                    onMouseEnter={() => { if (trackerRef.current) trackerRef.current.setPanelFocus('ai'); switchFocus(activeTab || 'chat'); }}
                                >
                                    {/* Extended UI with tabs for both conditions */}
                                        <>
                                            {/* Header */}
                                            <div className="px-4 py-3 border-b bg-white">
                                                <h2 className="text-lg font-semibold text-gray-800">Gen AI Assistant</h2>
                                                <p className="text-sm text-gray-500">Feel free to explore AI-generated content to help your reading.</p>
                                            </div>

                                            {/* Tab Chips */}
                                            {(() => {
                                                const tabConfig = {
                                                    video: { icon: '🎬', label: 'Video Overview', activeClass: 'bg-green-50 border-green-400 text-green-700', iconClass: 'text-green-600' },
                                                    audio: { icon: '👥', label: 'Podcast', activeClass: 'bg-purple-50 border-purple-400 text-purple-700', iconClass: 'text-purple-600' },
                                                    infographics: { icon: '🗺️', label: 'Infographic', activeClass: 'bg-indigo-50 border-indigo-400 text-indigo-700', iconClass: 'text-indigo-600' },
                                                    chat: { icon: '💬', label: 'AI Chatbot', activeClass: 'bg-blue-50 border-blue-400 text-blue-700', iconClass: 'text-blue-600' }
                                                };
                                                return (
                                                    <div className="flex flex-wrap gap-2 px-4 py-3 bg-white border-b">
                                                        {tabOrder.map(tabKey => {
                                                            const tab = tabConfig[tabKey];
                                                            // A generation started in one tab finishes while the reader
                                                            // is somewhere else, so the tab itself has to say so.
                                                            const jobKey = tabKey === 'infographics' ? 'infographic' : tabKey;
                                                            const jobStatus = customJobs[jobKey]?.status;
                                                            return (
                                                                <button
                                                                    key={tabKey}
                                                                    onClick={() => handleTabSwitch(tabKey)}
                                                                    className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border text-xs font-medium transition-colors ${
                                                                        activeTab === tabKey
                                                                            ? tab.activeClass
                                                                            : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'
                                                                    }`}
                                                                >
                                                                    <span className={tab.iconClass}>{tab.icon}</span> {tab.label}
                                                                    {jobStatus === 'running' && (
                                                                        <span className="w-2 h-2 rounded-full bg-purple-500 animate-pulse" title="Still being made"></span>
                                                                    )}
                                                                    {jobStatus === 'done' && (
                                                                        <span className="w-2 h-2 rounded-full bg-green-500" title="Your version is ready"></span>
                                                                    )}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                );
                                            })()}

                                            {/* Tab Content */}
                                            <div className="flex-1 flex flex-col overflow-hidden">
                                                {activeTab === null && (
                                                    <div className="flex-1 flex flex-col bg-gray-50">
                                                        <div className="text-center text-gray-500 mt-8">
                                                            <div className="text-4xl mb-4">👆</div>
                                                            <p className="font-medium">Select a tab above to explore AI-generated content.</p>
                                                        </div>
                                                    </div>
                                                )}
                                                {activeTab !== null && tabLoading[activeTab] && (
                                                    <div className="flex-1 flex flex-col items-center justify-center bg-gray-50 relative overflow-hidden">
                                                        {/* Sparkles */}
                                                        <div className="absolute inset-0 pointer-events-none">
                                                            {[...Array(12)].map((_, i) => (
                                                                <div
                                                                    key={i}
                                                                    className="absolute text-purple-400"
                                                                    style={{
                                                                        left: `${10 + Math.random() * 80}%`,
                                                                        top: `${10 + Math.random() * 80}%`,
                                                                        animation: `sparkle ${1 + Math.random() * 1}s ease-in-out infinite`,
                                                                        animationDelay: `${Math.random() * 2}s`,
                                                                        fontSize: `${10 + Math.random() * 14}px`
                                                                    }}
                                                                >
                                                                    ✦
                                                                </div>
                                                            ))}
                                                        </div>
                                                        <div className="w-64 p-4 z-10">
                                                            <p className="text-gray-600 font-medium text-sm mb-3 text-center">✨ Loading content...</p>
                                                            <div className="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
                                                                <div className="bg-purple-500 h-2 rounded-full" style={{animation: 'loading 1.5s ease-in-out infinite'}}></div>
                                                            </div>
                                                        </div>
                                                        <style>{`
                                                            @keyframes loading {
                                                                0% { width: 20%; }
                                                                50% { width: 80%; }
                                                                100% { width: 20%; }
                                                            }
                                                            @keyframes sparkle {
                                                                0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
                                                                50% { opacity: 1; transform: scale(1) rotate(180deg); }
                                                            }
                                                        `}</style>
                                                    </div>
                                                )}
                                                {activeTab === 'infographics' && !tabLoading['infographics'] && infographicsTab}
                                                {activeTab === 'video' && !tabLoading['video'] && videoTab}
                                                {activeTab === 'audio' && !tabLoading['audio'] && audioTab}
                                                {activeTab === 'chat' && !tabLoading['chat'] && chatUI}
                                            </div>
                                        </>
                                </div>
                            )}
                        </div>

                        {/* Start Popup - External Tool Warning */}
                        {showStartPopup && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                                <div className="bg-white rounded-xl shadow-2xl p-8 max-w-lg w-full mx-4">
                                    <div className="text-center mb-6">
                                        <div className="text-5xl mb-4">📖</div>
                                        <h3 className="text-2xl font-bold text-gray-800">Before You Start</h3>
                                    </div>

                                    <div className="bg-amber-50 border-2 border-amber-300 rounded-lg p-5 mb-6">
                                        <p className="text-amber-800">
                                            <span className="font-bold">Please only use the tools provided on this platform.</span>
                                        </p>
                                        <p className="text-amber-800">
                                            NO external AI tools (e.g., ChatGPT, Claude, Gemini)
                                        </p>
                                        <p className="text-amber-800">
                                            NO external PDF viewers/apps during this assignment.
                                        </p>                                        
                                    </div>

                                    <label className="flex items-start space-x-3 cursor-pointer mb-6 p-3 border border-gray-200 rounded-lg hover:bg-gray-50">
                                        <input
                                            type="checkbox"
                                            checked={noExternalToolsAgreed}
                                            onChange={(e) => setNoExternalToolsAgreed(e.target.checked)}
                                            className="w-5 h-5 mt-0.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500"
                                        />
                                        <span className="text-sm font-medium text-gray-800">
                                            I will only use the tools provided on this platform.
                                        </span>
                                    </label>

                                    <button
                                        onClick={() => {
                                            if (noExternalToolsAgreed) {
                                                setShowStartPopup(false);
                                                logEvent('reading_start_confirmed', { agreedToNoExternalTools: true });
                                            }
                                        }}
                                        disabled={!noExternalToolsAgreed}
                                        className={`w-full px-6 py-4 rounded-lg text-lg font-medium ${
                                            noExternalToolsAgreed
                                                ? 'bg-blue-600 text-white hover:bg-blue-700'
                                                : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                                        }`}
                                    >
                                        Confirm & Start Reading
                                    </button>
                                </div>
                            </div>
                        )}

                    </div>
                );
            }

            // COMPLETE PHASE
            if (phase === 'complete') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-2xl p-12 max-w-2xl w-full text-center">
                            <div className="text-6xl mb-6">🎉</div>
                            <h1 className="text-4xl font-bold text-gray-800 mb-4">Reading Complete!</h1>
                            <p className="text-gray-600 mb-8">Thank you for your participation.</p>

                            <div className="bg-gray-50 rounded-lg p-6 mb-8 text-left">
                                <h3 className="font-bold text-lg mb-4">Summary</h3>
                                <div className="space-y-2 text-gray-700">
                                    <p>• Participant: <strong>{window.firebaseCurrentUser?.email || ''}</strong></p>
                                    <p>• Condition: <strong>{condition}</strong></p>
                                    <p>• Paper: <strong>{customPdfData?.title || 'Uploaded Paper'}</strong></p>
                                </div>
                            </div>

                            <button
                                onClick={returnToStart}
                                className="px-8 py-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-lg font-medium"
                            >
                                Return to Start
                            </button>
                        </div>
                    </div>
                );
            }

            return null;
        }

        ReactDOM.render(<ReadingExperimentAOM />, document.getElementById('root'));
    </script>

</body>
</html>
