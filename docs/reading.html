        // Timer Component - supports both countdown (seconds > 0) and count-up (seconds === 0) modes
        function Timer({ seconds, onComplete, isActive, phase, onTimeUpdate }) {
            const [time, setTime] = useState(seconds);
            const isCountUp = seconds === 0;

            useEffect(() => {
                setTime(seconds);
            }, [phase, seconds]);

            useEffect(() => {
                if (!isActive) return;

                const interval = setInterval(() => {
                    setTime(prev => {
                        if (isCountUp) {
                            // Count up mode - elapsed time
                            const newTime = prev + 1;
                            if (onTimeUpdate) onTimeUpdate(newTime);
                            return newTime;
                        } else {
                            // Countdown mode
                            const newTime = prev - 1;
                            if (onTimeUpdate) onTimeUpdate(newTime);
                            if (newTime <= 0) {
                                clearInterval(interval);
                                if (onComplete) onComplete();
                                return 0;
                            }
                            return newTime;
                        }
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [isActive, onComplete, onTimeUpdate, isCountUp]);

            const minutes = Math.floor(time / 60);
            const secs = time % 60;
            const isLowTime = !isCountUp && time < 300;

            return (
                <div className={`flex items-center space-x-2 px-4 py-2 rounded-lg font-mono text-lg ${
                    isLowTime ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                }`}>
                    <ClockIcon />
                    <span>{String(minutes).padStart(2, '0')}:{String(secs).padStart(2, '0')}</span>
                </div>
            );
        }

                    timeOnPreviousFocus: elapsed

                setActiveFocus(newFocus);

## Core EBM Framework

### Definition
Evidence-based management is making decisions through the conscientious, explicit, and judicious use of four sources of information:
1. **Scientific literature** - findings from academic research
2. **Organizational evidence** - data and facts from the user's organization
3. **Practitioner expertise** - professional experience and judgment
4. **Stakeholder perspectives** - values and concerns of affected people

**4. AGGREGATE** - Synthesize and weigh evidence

- "The authors note that their sample was limited to Fortune 500 companies. In what ways might this affect how broadly we can apply these findings?"
- "This research was conducted in 2015, before remote work became widespread. How might the changing nature of work affect these conclusions today?"

---

#### Information → Analyze
**User example:** "Compare the findings of these two papers"

**Response pattern:**
1. Provide analysis
2. Then ask **Critical Appraisal** question:
   - "How might the contextual differences between these studies have affected their results?"

---

#### Advice → Improve
**User example:** "Help me refine this implementation plan"

**Response pattern:**
1. Provide improved version
2. Then ask **Contextualization** question:
   - "Is this improved version feasible within your organization's realities?"

---

#### Advice → Guidance
**User example:** "How should I apply this research to my team?"

**Response pattern:**
1. Provide guidance/recommendations
2. Then ask **Contextualization** question that:
   - Names specific characteristics of the research setting
   - Asks user to evaluate fit with their situation

**Question template:**
"This recommendation is based on research in [specific setting details]. [Open-ended prompt comparing to user's context]"

**Examples:**
- "This approach was validated in teams of 5-8 people working on creative tasks. How does your team's size and type of work compare?"
- "The study found this intervention worked when implemented over 6 months with weekly check-ins. What timeline and cadence would be realistic in your environment?"

---

#### Advice → Validation
**User example:** "Check if our hypothesis aligns with this paper's findings"

**Response pattern:**
1. Provide validation assessment
2. Then ask **Critical Appraisal** question that:
   - Points to the basis of validation (what evidence supports/contradicts)
   - Asks user to consider strength of evidence

**Question template:**
"The paper [supports/contradicts] your hypothesis based on [specific evidence]. [Open-ended prompt about evidence quality or alternatives]"

**Examples:**
- "The paper supports your hypothesis, but the evidence comes from a single field experiment. What would make you more confident in this conclusion?"
- "There's partial support for your idea, but the authors measured outcomes differently than you're planning to. How might this difference in measurement affect the comparison?"

---

#### Automation → ⚠️ WARNING
**User example:** "Read this paper and create a complete action plan for me"

**Response pattern:**
1. Pause and redirect: "I can help with that, but let's make sure this plan fits your situation."
2. Ask **Critical Appraisal** first:
   - "Before we build a plan, let's examine the research foundation. [Specific detail about study's scope/limitations]. What aspects of this study design give you confidence—or concern—about applying it?"
3. Then ask **Contextualization**:
   - "The study was done in [specific context]. [Open-ended comparison to user's context]"
4. Only proceed after user engages with both

---

## Handling User Responses to EBM Questions

### If user answers thoughtfully:
- Acknowledge their reflection
- Build on their answer
- Continue the conversation

### If user ignores the question:
- Gently bring it back: "What do you think about that question? It might be helpful to consider before applying this."
- If ignored twice, respect their choice but note: "Feel free to revisit this later if it becomes relevant."

### If user says "I don't know":
- Help them think through it: "Let's think about it together. What characteristics does your organization have?"

### If user pushes back ("Just give me the answer"):
- Acknowledge their need, then explain briefly: "Of course, I'll help you right away. I just want to ask one thing to make sure this research fits your situation."

---

## Question Bank by Type

### Critical Appraisal Questions (Quality/Trustworthiness of Research)
- "What was the sample size and population in this study?"
- "Are there any methodological concerns to be aware of?"
- "What was the context (industry, country, time period) of this research?"
- "Did the authors mention any limitations?"
- "Could there be alternative explanations for these findings?"

### Contextualization Questions (Application Context)
- "How does your organization/team situation differ from the research context?"
- "What preconditions would be needed to apply this?"
- "Do you have any relevant organizational data on this topic?"
- "How might stakeholders react to this change?"
- "What are the realistic constraints on implementation?"

---

## Warning Signs to Address

### 1. Over-reliance on Single Studies
- "This paper says..." → "Have you checked if other studies found similar results?"

### 2. Ignoring Context
- "Google does it this way..." → "What are the differences between Google and your organization?"

### 3. Confirmation Bias
- User only cites evidence supporting their preference → "Was there any contradicting evidence?"

### 4. Shallow Processing
- Quick acceptance without critical evaluation → "Let's pause and look more closely at the methodology..."

---

## Language and Tone

### Do:
- Ask questions with genuine curiosity
- Ask more questions than give answers
- Use open-ended phrases like "What do you think about...?", "How might...", "In what ways..."
- Reference specific details from the paper when asking questions
- Respect the user's expertise

### Don't:
- "You should..." (prescriptive language)
- "Research proves that..." (overconfidence)
- "This is best practice" (ignoring context)
- Adopt a lecturing tone
- Ask Yes/No questions like "Would you like to...?", "Shall we...?", "Do you want to...?"
- Ask generic questions without referencing specific paper content

---

## EBM Question Tone Guide

When asking EBM questions, sound like a practical coach, NOT an academic reviewer.

### Do:
- Ask about concrete organizational situations
- Invite the user to imagine APPLYING the paper, not just interpreting it
- Use everyday language: "your team", "in practice", "realistically"

### Avoid:
- Abstract academic terms: "generalizability", "implications", "interpret"
- Questions that sound like peer review feedback
- Overly formal phrasing

### Examples:
- ❌ "How might this affect the generalizability of these results?"
- ✅ "How would this play out in your team?"

- ❌ "What implications might this have for how we interpret the findings?"
- ✅ "Which of these would actually be hard to do in your organization?"

- ❌ "In what ways might this affect how broadly we can apply these findings?"
- ✅ "What feels unrealistic about applying this where you work?"

--

## Important Principles

1. **Evidence ≠ Answer**: Evidence reduces uncertainty but doesn't eliminate it
2. **Context matters**: What works "in general" may not work "here"
3. **Multiple sources**: No single evidence source is sufficient
4. **Healthy skepticism**: Question even popular claims
5. **Humility**: The best practitioners know what they don't know
6. **Learning orientation**: Treat decisions as opportunities to learn

- Scientific evidence from the paper

            // Markdown renderer with nested lists, tables, blockquotes, and horizontal rules
            const renderMarkdown = (text) => {
                if (!text) return '';

                let html = text;

                // Code blocks (```code```) - process first to avoid interference
                html = html.replace(/```([^`]+)```/g, '<pre style="background: #f5f5f5; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0;"><code>$1</code></pre>');

                // Inline code (`code`)
                html = html.replace(/`([^`]+)`/g, '<code style="background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 0.9em;">$1</code>');

                // Bold (**text** or __text__)
                html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');

                // Italic (*text* or _text_) - be careful not to match list items
                html = html.replace(/(?<![*\-])\*([^\*\n]+)\*(?!\*)/g, '<em>$1</em>');
                html = html.replace(/(?<!_)_([^_\n]+)_(?!_)/g, '<em>$1</em>');

                // Headers (# text) - process from most specific (####) to least specific (#)
                html = html.replace(/^#### (.+)$/gm, '<h4 style="font-size: 1.1em; font-weight: 600; margin: 12px 0 6px 0;">$1</h4>');
                html = html.replace(/^### (.+)$/gm, '<h3 style="font-size: 1.2em; font-weight: 600; margin: 14px 0 8px 0;">$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2 style="font-size: 1.35em; font-weight: 600; margin: 16px 0 10px 0;">$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1 style="font-size: 1.5em; font-weight: 600; margin: 16px 0 10px 0;">$1</h1>');

                // Horizontal rule (---, ***, ___)
                html = html.replace(/^[-*_]{3,}$/gm, '<hr style="border: none; border-top: 1px solid #ddd; margin: 16px 0;">');

                // Process tables
                html = html.replace(/(?:^|\n)((?:\|[^\n]+\|\n)+)/g, (match, tableContent) => {
                    const rows = tableContent.trim().split('\n');
                    if (rows.length < 2) return match;

                    let tableHtml = '<table style="border-collapse: collapse; margin: 12px 0; width: 100%;">';

                    rows.forEach((row, rowIndex) => {
                        // Skip separator row (|---|---|)
                        if (row.match(/^\|[\s\-:]+\|$/)) return;

                        const cells = row.split('|').filter(cell => cell !== '');
                        const tag = rowIndex === 0 ? 'th' : 'td';
                        const bgColor = rowIndex === 0 ? 'background: #f5f5f5;' : '';

                        tableHtml += '<tr>';
                        cells.forEach(cell => {
                            tableHtml += `<${tag} style="border: 1px solid #ddd; padding: 8px; ${bgColor}">${cell.trim()}</${tag}>`;
                        });
                        tableHtml += '</tr>';
                    });

                    tableHtml += '</table>';
                    return tableHtml;
                });

                // Process lines for lists and blockquotes
                const lines = html.split('\n');
                let result = [];
                let listStack = []; // Track nested list levels: [{type: 'ul'|'ol', indent: number}]
                let inBlockquote = false;

                const getIndentLevel = (line) => {
                    const match = line.match(/^(\s*)/);
                    return match ? Math.floor(match[1].length / 2) : 0;
                };

                const closeListsToLevel = (targetLevel) => {
                    while (listStack.length > targetLevel) {
                        const list = listStack.pop();
                        result.push(list.type === 'ul' ? '</ul>' : '</ol>');
                    }
                };

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const indent = getIndentLevel(line);
                    const trimmedLine = line.trim();

                    // Blockquote (> text)
                    const blockquoteMatch = trimmedLine.match(/^>\s*(.*)$/);
                    if (blockquoteMatch) {
                        closeListsToLevel(0);
                        if (!inBlockquote) {
                            result.push('<blockquote style="border-left: 4px solid #ddd; margin: 12px 0; padding: 8px 16px; color: #666; background: #f9f9f9;">');
                            inBlockquote = true;
                        }
                        result.push(blockquoteMatch[1] + '<br>');
                        continue;
                    } else if (inBlockquote) {
                        result.push('</blockquote>');
                        inBlockquote = false;
                    }

                    // Unordered list (- or *)
                    const unorderedMatch = trimmedLine.match(/^[\-\*]\s+(.+)$/);
                    // Ordered list (1. 2. etc)
                    const orderedMatch = trimmedLine.match(/^\d+\.\s+(.+)$/);

                    if (unorderedMatch) {
                        const targetLevel = indent + 1;

                        // Close lists that are deeper than current
                        closeListsToLevel(targetLevel);

                        // Open new list if needed
                        if (listStack.length < targetLevel || listStack[listStack.length - 1]?.type !== 'ul') {
                            if (listStack.length === targetLevel && listStack[listStack.length - 1]?.type === 'ol') {
                                result.push('</ol>');
                                listStack.pop();
                            }
                            result.push('<ul style="margin: ' + (listStack.length === 0 ? '8px' : '4px') + ' 0; padding-left: 24px; list-style-type: disc;">');
                            listStack.push({ type: 'ul', indent });
                        }
                        result.push('<li style="margin: 4px 0;">' + unorderedMatch[1] + '</li>');
                    } else if (orderedMatch) {
                        const targetLevel = indent + 1;

                        closeListsToLevel(targetLevel);

                        if (listStack.length < targetLevel || listStack[listStack.length - 1]?.type !== 'ol') {
                            if (listStack.length === targetLevel && listStack[listStack.length - 1]?.type === 'ul') {
                                result.push('</ul>');
                                listStack.pop();
                            }
                            result.push('<ol style="margin: ' + (listStack.length === 0 ? '8px' : '4px') + ' 0; padding-left: 24px; list-style-type: decimal;">');
                            listStack.push({ type: 'ol', indent });
                        }
                        result.push('<li style="margin: 4px 0;">' + orderedMatch[1] + '</li>');
                    } else {
                        // Not a list item - close all lists
                        closeListsToLevel(0);

                        if (trimmedLine === '') {
                            result.push('<br>');
                        } else if (!trimmedLine.startsWith('<')) {
                            // Regular text (not HTML tag)
                            result.push(line + '<br>');
                        } else {
                            result.push(line);
                        }
                    }
                }

                // Close any remaining open elements
                closeListsToLevel(0);
                if (inBlockquote) result.push('</blockquote>');

                html = result.join('');

                return html;

                                        className="w-full px-4 py-2 rounded-lg bg-purple-600 text-white font-medium hover:bg-purple-700 disabled:bg-purple-300"
                                    >
                                        {customBusy[modality] ? 'Starting…' : 'Generate'}
                                    </button>
                                </div>
                            )}

                            {(running || done || status === 'error' || status === 'aborted') && (
                                <div className="space-y-2">
                                    {job?.focus ? (
                                        <div className="bg-gray-100 rounded-lg px-3 py-2 text-sm text-gray-700">
                                            <span className="text-xs text-gray-500 block">You asked for</span>
                                            {job.focus}
                                        </div>
                                    ) : (
                                        <div className="bg-gray-100 rounded-lg px-3 py-2 text-sm text-gray-500">
                                            You asked for a fresh version, with no particular focus.
                                        </div>
                                    )}

                                    {running && (
                                        <div className="bg-purple-50 border border-purple-200 rounded-lg px-3 py-3">
                                            <div className="flex items-center space-x-2 text-purple-800 text-sm">
                                                <svg className="animate-spin h-4 w-4" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                                </svg>
                                                <span>{job.message || 'Working'}{job.total ? ` — ${job.done || 0} of ${job.total}` : ''}</span>
                                            </div>
                                            {job.total > 0 && (
                                                <div className="h-1.5 bg-purple-100 rounded-full overflow-hidden mt-2">
                                                    <div className="h-full bg-purple-500" style={{ width: `${Math.round(((job.done || 0) / job.total) * 100)}%` }}></div>
                                                </div>
                                            )}
                                            <p className="text-xs text-purple-700 mt-2">
                                                You can keep reading the article while this is made.
                                            </p>
                                            <button
                                                type="button"
                                                onClick={() => cancelCustom(modality)}
                                                className="mt-3 text-xs text-purple-700 underline"
                                            >
                                                Stop — this cannot be resumed
                                            </button>
                                        </div>
                                    )}

                                    {done && (
                                        <div className="bg-green-50 border border-green-200 rounded-lg px-3 py-2 text-sm text-green-800">
                                            ✓ Ready — use the switch above to compare it with the original.
                                        </div>
                                    )}

                                    {status === 'error' && (
                                        <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-sm text-red-700">
                                            Something went wrong, so this did not use up your turn. You can try again.
                                        </div>
                                    )}

                                    {status === 'aborted' && (
                                        <div className="bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 text-sm text-amber-800">
                                            Stopped. This did not use up your turn, so you can start again.
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    );
                };

                // Flips a tab between the version everyone gets and the reader's own.
                const customSwitch = (modality) => {
                    if (!caps.customize || customJobs[modality]?.status !== 'done') return null;
                    const mine = !!showingCustom[modality];
                    return (
                        <div className="flex justify-center mb-3">
                            <div className="inline-flex rounded-lg border border-gray-300 overflow-hidden text-sm">
                                {[['Original', false], ['Yours', true]].map(([label, want]) => (
                                    <button
                                        key={label}
                                        type="button"
                                        onClick={() => {
                                            setShowingCustom(prev => ({ ...prev, [modality]: want }));
                                            if (modality === 'video') {
                                                // The two versions have different scenes, so the
                                                // playhead cannot carry across.
                                                setSlideshowPlaying(false);
                                                setCurrentSceneIndex(0);
                                                setSceneElapsed(0);
                                            }
                                            logEvent('custom_version_viewed', { modality, version: want ? 'custom' : 'original' });
                                        }}
                                        className={`px-4 py-1.5 ${mine === want ? 'bg-purple-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-50'}`}
                                    >
                                        {label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    );
                };

                const infographicsTab = (
                    <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                        {resourceContent.infographics ? (
                            <div className="max-w-2xl mx-auto">
                                {customSwitch('infographic')}
                                <img
                                    src={showingCustom.infographic && customJobs.infographic?.status === 'done'
                                        ? customJobs.infographic.url
                                        : resourceContent.infographics}
                                    alt="Infographic"
                                    className="max-w-full h-auto mx-auto"
                                />
                                {customPanel('infographic')}
                            </div>
                        ) : (
                            <div className="text-center text-gray-500 mt-12">
                                <div className="text-4xl mb-4">📊</div>
                                <p>No infographic available</p>
                            </div>
                        )}
                    </div>
                );

                // Sync narration with video playback
                const handleVideoPlayWithNarration = () => {
                    handleVideoPlay();
                    if (narrationAudioRef.current && resourceContent.videoNarration) {
                        narrationAudioRef.current.currentTime = videoRef.current?.currentTime || 0;
                        narrationAudioRef.current.play();
                    }
                };

                const handleVideoPauseWithNarration = () => {
                    handleVideoPause();
                    if (narrationAudioRef.current) {
                        narrationAudioRef.current.pause();
                    }
                };

                const handleVideoEndedWithNarration = () => {
                    handleVideoEnded();
                    if (narrationAudioRef.current) {
                        narrationAudioRef.current.pause();
                        narrationAudioRef.current.currentTime = 0;
                    }
                };

                const handleVideoSeekedWithNarration = () => {
                    handleVideoSeeked();
                    if (narrationAudioRef.current && videoRef.current) {
                        narrationAudioRef.current.currentTime = videoRef.current.currentTime;
                    }
                };

                // Video Tab — the overview is a narrated slideshow: each scene holds
                // still while its narration plays, and the narration ending is what
                // turns the page. The play/pause handlers are the ones the recorder
                // already listens to, so the tab is logged like the old <video> was.
                // Which slideshow the video tab is showing: the one everybody gets,
                // or the reader's own once they have made it.
                const customVideoJob = customJobs.video;
                const activeSlideshow = (showingCustom.video && customVideoJob?.status === 'done')
                    ? { title: customVideoJob.title, scenes: customVideoJob.scenes.map(sc => ({ ...sc, imageUrl: sc.image, audioUrl: sc.audio })) }
                    : videoSlideshow;
                activeSlideshowRef.current = activeSlideshow;
                const scene = activeSlideshow?.scenes?.[currentSceneIndex];
                const videoTab = (
                    <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                        {activeSlideshow && scene ? (
                            <div className="max-w-2xl mx-auto">
                                {customSwitch('video')}
                                <div className="relative bg-white rounded-lg shadow-lg overflow-hidden">
                                    <img
                                        src={scene.imageUrl}
                                        alt={`Scene ${currentSceneIndex + 1}`}
                                        className="w-full block"
                                        draggable={false}
                                    />
                                    {showNarration && (
                                        <div className="absolute bottom-0 left-0 right-0 bg-black bg-opacity-70 text-white text-sm p-3 leading-snug">
                                            {scene.narration}
                                        </div>
                                    )}
                                </div>

                                <div className="mt-3">
                                    <div
                                        className="h-2 bg-gray-200 rounded-full overflow-hidden cursor-pointer"
                                        onClick={(e) => {
                                            if (!videoDuration) return;
                                            const r = e.currentTarget.getBoundingClientRect();
                                            const want = ((e.clientX - r.left) / r.width) * videoDuration;
                                            let i = 0;
                                            while (i < activeSlideshow.scenes.length - 1 && getSceneStartTime(i + 1) <= want) i++;
                                            pendingSeekRef.current = Math.max(0, want - getSceneStartTime(i));
                                            if (i === currentSceneIndex && slideshowAudioRef.current) {
                                                slideshowAudioRef.current.currentTime = pendingSeekRef.current;
                                                pendingSeekRef.current = 0;
                                            } else {
                                                setCurrentSceneIndex(i);
                                            }
                                            logEvent('video_seeked', { toSecond: Math.round(want) });
                                        }}
                                    >
                                        <div
                                            className="h-full bg-purple-500"
                                            style={{ width: `${videoDuration ? Math.min(100, ((getSceneStartTime(currentSceneIndex) + sceneElapsed) / videoDuration) * 100) : 0}%` }}
                                        ></div>
                                    </div>
                                    <div className="flex justify-between items-center text-xs text-gray-500 mt-1">
                                        <span>{fmtClock(getSceneStartTime(currentSceneIndex) + sceneElapsed)} / {fmtClock(videoDuration)}</span>
                                        <div className="flex items-center space-x-3">
                                            <button
                                                type="button"
                                                onClick={() => {
                                                    setShowNarration(!showNarration);
                                                    logEvent('video_captions_toggled', { shown: !showNarration });
                                                }}
                                                className={`px-2 py-0.5 rounded border ${showNarration ? 'border-purple-400 text-purple-700 bg-purple-50' : 'border-gray-300 text-gray-500'}`}
                                            >
                                                {showNarration ? 'Script on' : 'Script off'}
                                            </button>
                                            <span>Scene {currentSceneIndex + 1} / {activeSlideshow.scenes.length}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="flex items-center justify-center space-x-3 mt-4">
                                    <button
                                        onClick={() => { if (currentSceneIndex > 0) setCurrentSceneIndex(currentSceneIndex - 1); }}
                                        disabled={currentSceneIndex === 0}
                                        className="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 disabled:opacity-40"
                                    >
                                        ← Prev
                                    </button>
                                    <button
                                        onClick={() => {
                                            if (slideshowPlaying) { pauseSlideshow(); handleVideoPause(); }
                                            else { setSlideshowPlaying(true); handleVideoPlay(); }
                                        }}
                                        className="px-8 py-2 rounded-lg bg-purple-600 text-white font-medium hover:bg-purple-700"
                                    >
                                        {slideshowPlaying ? '⏸ Pause' : '▶ Play'}
                                    </button>
                                    <button
                                        onClick={() => { if (currentSceneIndex < activeSlideshow.scenes.length - 1) setCurrentSceneIndex(currentSceneIndex + 1); }}
                                        disabled={currentSceneIndex >= activeSlideshow.scenes.length - 1}
                                        className="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 disabled:opacity-40"
                                    >
                                        Next →
                                    </button>
                                </div>

                                <audio
                                    ref={slideshowAudioRef}
                                    src={scene.audioUrl}
                                    onTimeUpdate={(e) => setSceneElapsed(e.target.currentTime)}
                                    onLoadedMetadata={(e) => {
                                        if (pendingSeekRef.current) {
                                            e.target.currentTime = Math.min(pendingSeekRef.current, e.target.duration || pendingSeekRef.current);
                                            pendingSeekRef.current = 0;
                                        }
                                        setSceneElapsed(e.target.currentTime);
                                    }}
                                    onEnded={() => {
                                        if (currentSceneIndex < activeSlideshow.scenes.length - 1) {
                                            setCurrentSceneIndex(currentSceneIndex + 1);
                                        } else {
                                            setSlideshowPlaying(false);
                                            handleVideoEnded();
                                        }
                                    }}
                                />

                                {customPanel('video')}
                            </div>
                        ) : (
                            <div className="text-center text-gray-500 mt-12">
                                <div className="text-4xl mb-4">🎬</div>
                                <p>Loading the video overview…</p>
                            </div>
                        )}
                    </div>
                );

                // Audio Tab - inline JSX
                const audioTab = (
                    <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                        {resourceContent.audio ? (
                            <div className="max-w-md mx-auto">
                                {customSwitch('audio')}
                                <div className="flex flex-col items-center justify-center py-6">
                                    <div className="text-6xl mb-6">🎧</div>
                                    <audio
                                        key={showingCustom.audio && customJobs.audio?.status === 'done' ? 'custom' : 'default'}
                                        ref={audioRef}
                                        controls
                                        className="w-full"
                                        onPlay={handleAudioPlay}
                                        onPause={handleAudioPause}
                                        onEnded={handleAudioEnded}
                                        onSeeking={handleAudioSeeking}
                                        onSeeked={handleAudioSeeked}
                                    >
                                        <source
                                            src={showingCustom.audio && customJobs.audio?.status === 'done' ? customJobs.audio.url : resourceContent.audio}
                                            type="audio/mpeg"
                                        />
                                        Your browser does not support the audio element.
                                    </audio>
                                </div>

                                {customPanel('audio')}
                            </div>
                        ) : (
                            <div className="text-center text-gray-500 mt-12">
                                <div className="text-4xl mb-4">🎵</div>
                                <p>No audio available</p>
                            </div>
                        )}
                    </div>
                );

                return (
                    <div className="h-screen flex flex-col bg-gray-100">
                        {/* Header */}
                        {isPaused && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center text-center text-white"
                                 style={{ background: 'rgba(10,12,15,0.93)', backdropFilter: 'blur(9px)' }}>
                                <div>
                                    <h2 className="text-2xl font-bold mb-2">Reading paused</h2>
                                    <p className="text-gray-300 mb-6 max-w-sm">Leave this window open — closing it ends your session.</p>
                                    <button
                                        onClick={() => {
                                            setIsPaused(false);
                                            if (trackerRef.current) trackerRef.current.setPaused(false);
                                        }}
                                        className="px-6 py-3 rounded-lg font-medium bg-green-600 text-white hover:bg-green-700"
                                    >
                                        Resume reading
                                    </button>
                                </div>
                            </div>
                        )}
                        <div className="bg-white shadow-md px-6 py-4 flex items-center justify-between border-b-2">
                            <div>
                                <h2 className="text-lg font-bold text-gray-800">
                                    [Paper Reading] {customPdfData?.title || 'Uploaded Paper'}
                                </h2>
                                <p className="text-sm text-gray-600">
                                    {window.firebaseCurrentUser?.email || ''}
                                </p>
                            </div>
                            <div className="flex items-center space-x-4">
                                <span className="font-mono text-lg font-semibold text-gray-700 px-3 py-2 bg-gray-100 rounded-lg" title="Reading time (pauses excluded)">
                                    ⏱ {clock}
                                </span>
                                <button
                                    onClick={() => {
                                        setIsPaused(true);
                                        if (trackerRef.current) trackerRef.current.setPaused(true);
                                    }}
                                    className="px-5 py-3 rounded-lg font-medium border border-gray-300 text-gray-700 hover:bg-gray-100"
                                >
                                    Pause
                                </button>
                                <button
                                    onClick={() => {
                                        logEvent('finish_reading_clicked');
                                        // Minimum reading time, counted on the header clock (pauses excluded).
                                        // Client-side only, like the rest of study2's flow; the recorder
                                        // has the exact on/paused spans if this ever needs auditing.
                                        const skip = (() => { try { return localStorage.getItem('devSkipMinTime') === '1'; } catch (e) { return false; } })();
                                        if (!skip && activeSeconds < MIN_READING_SECONDS) {
                                            const left = MIN_READING_SECONDS - activeSeconds;
                                            logEvent('finish_blocked_min_time', { activeSeconds, remainingSeconds: left });
                                            window.alert(`Please keep reading. The reading session is at least ${Math.round(MIN_READING_SECONDS / 60)} minutes; you have ${Math.floor(left / 60)} min ${left % 60} s to go (time spent paused does not count).`);
                                            return;
                                        }
                                        // Every arm that is given a chatbot is asked to use it at least
                                        // once. This is a nudge, not a gate: whoever still does not want
                                        // to may go on, and the choice is logged so that the two groups
                                        // can be told apart in analysis.
                                        const llmQueryCount = messages.filter(m => m.role === 'user').length;
                                        let chatSkipped = false;
                                        if (!skip && showRightPanel && llmQueryCount === 0) {
                                            logEvent('finish_no_llm_prompted', { condition });
                                            const goBack = window.confirm(
                                                'You have not asked the AI chatbot anything yet.\n\n' +
                                                'We recommend asking it at least one question about the article before you finish.\n\n' +
                                                'OK — go back and use the chatbot\n' +
                                                'Cancel — finish without using it'
                                            );
                                            if (goBack) {
                                                logEvent('finish_no_llm_returned', { condition });
                                                return;
                                            }
                                            chatSkipped = true;
                                            logEvent('finish_no_llm_skipped', { condition });
                                        }
                                        if (chatSkipped || window.confirm('Are you sure you want to finish reading?')) {
                                            logEvent('finish_reading_confirmed', { llmQueryCount, chatSkipped });
                                            // Anything still generating would run on after the reader has
                                            // gone, costing money for something nobody will ever see.
                                            Object.entries(customJobs).forEach(([modality, job]) => {
                                                if (job?.status === 'running') cancelCustom(modality, 'finished_reading');
                                            });
                                            completeReading();
                                        } else {
                                            logEvent('finish_reading_cancelled');
                                        }
                                    }}
                                    className="flex items-center space-x-2 px-6 py-3 rounded-lg font-medium bg-green-600 text-white hover:bg-green-700"
                                >
                                    <CheckIcon />
                                    <span>Finish Reading</span>
                                </button>
                            </div>
                        </div>

                        {/* Main content */}
                        <div ref={containerRef} className="flex-1 flex overflow-hidden relative"
                             onMouseLeave={() => trackerRef.current && trackerRef.current.setPanelFocus('none')}>
                            {/* Resize overlay - prevents PDF embed from capturing mouse events during resize */}
                            {isResizing && (
                                <div className="absolute inset-0 z-50 cursor-col-resize" />
                            )}
                            {/* Left Panel - Paper */}
                            <div
                                className={`bg-white flex flex-col overflow-hidden absolute top-0 bottom-0 left-0 ${
                                    showRightPanel && activeFocus === 'reading' ? 'border-4 border-purple-500' : 'border-4 border-transparent'
                                }`}
                                style={{ width: showRightPanel ? `calc(${leftPanelWidth}% - 4px)` : '100%' }}
                                onMouseEnter={() => { if (trackerRef.current) trackerRef.current.setPanelFocus('reading'); if (showRightPanel) switchFocus('reading'); }}
                            >
                                <div
                                    ref={pdfContainerRef}
                                    onScroll={handleScroll}
                                    onMouseUp={handleTextSelection}
                                    className="flex-1 overflow-y-auto"
                                >
                                    {showSocraticPanel ? (
                                        /* Socratic condition: paper centered with fixed right panel */
                                        <div className="flex h-full">
                                            {/* Paper - centered like without_llm */}
                                            <div
                                                ref={isCustomPdf ? pdfContainerScrollRef : null}
                                                onScroll={isCustomPdf ? handlePdfScroll : undefined}
                                                className="flex-1 overflow-y-auto"
                                            >
                                                {pdfLoading ? (
                                                    /* Loading state */
                                                    <div className="w-full h-full flex items-center justify-center" style={{ minHeight: 'calc(100vh - 120px)' }}>
                                                        <div className="text-center">
                                                            <svg className="animate-spin h-12 w-12 text-blue-600 mx-auto mb-4" viewBox="0 0 24 24">
                                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                            </svg>
                                                            <p className="text-gray-600 font-medium">Loading PDF...</p>
                                                        </div>
                                                    </div>
                                                ) : isCustomPdf && pdfRenderedPages.length > 0 ? (
                                                    /* Custom PDF: Embed for text selection with activity tracking */
                                                    <div
                                                        ref={pdfContainerScrollRef}
                                                        onScroll={handlePdfScroll}
                                                        className="w-full h-full bg-gray-200"
                                                        onMouseEnter={handlePdfAreaEnter}
                                                        onMouseLeave={handlePdfAreaLeave}
                                                        onWheel={handlePdfWheel}
                                                    >
                                                        <iframe
                                                            src="papers/hafner2014/paper.pdf"
                                                            title="Paper"
                                                            style={{ width: '100%', height: '100%', border: 0, display: 'block' }}
                                                        />
                                                    </div>
                                                ) : isCustomPdf && customPdfData?.base64 ? (
                                                    /* PDF data exists but Blob URL not created yet - show loading */
                                                    <div className="w-full h-full flex items-center justify-center" style={{ minHeight: 'calc(100vh - 120px)' }}>
                                                        <div className="text-center">
                                                            <svg className="animate-spin h-12 w-12 text-blue-600 mx-auto mb-4" viewBox="0 0 24 24">
                                                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                            </svg>
                                                            <p className="text-gray-600 font-medium">Rendering pages...</p>
                                                        </div>
                                                    </div>
                                                ) : isCustomPdf ? (
                                                    /* PDF failed to load - show error message */
                                                    <div className="w-full h-full flex items-center justify-center" style={{ minHeight: 'calc(100vh - 120px)' }}>
                                                        <div className="text-center max-w-md p-8">
                                                            <div className="text-6xl mb-4">📄</div>
                                                            <h3 className="text-xl font-bold text-gray-800 mb-3">Unable to load PDF</h3>
                                                            <div className="text-left bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-4">
                                                                <p className="text-sm text-gray-700 mb-2"><strong>Please try the following:</strong></p>
                                                                <ol className="text-sm text-gray-600 list-decimal list-inside space-y-1">
                                                                    <li>Refresh the page (Ctrl+R or Cmd+R)</li>
                                                                    <li>Use a different browser (Chrome recommended)</li>
                                                                    <li>Start over (re-upload PDF from index page)</li>
                                                                </ol>
                                                            </div>
                                                            <p className="text-sm text-gray-500">
                                                                If the problem persists, please contact:<br/>
                                                                <a href="mailto:sh.bae@snu.ac.kr" className="text-blue-600 hover:underline font-medium">sh.bae@snu.ac.kr</a>
                                                            </p>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    /* Standard HTML paper content */
                                                    <div className="w-full max-w-[900px] mx-auto p-12">
                                                        <div
                                                            id="paper-content"
                                                            className="prose max-w-none"
                                                            dangerouslySetInnerHTML={{ __html: paperContent || '<p>Loading paper...</p>' }}
                                                        />
                                                    </div>
                                                )}
                                            </div>
                                            {/* Right panel for Socratic questions - fixed width */}
                                            <div className="w-[400px] flex-shrink-0 border-l border-gray-200 bg-white flex flex-col overflow-hidden">
                                                {/* Header */}
                                                <div className="px-6 py-4 bg-gradient-to-r from-purple-50 to-indigo-50 border-b border-purple-200">
                                                    <h3 className="font-bold text-purple-800 text-lg flex items-center gap-2">
                                                        🤔 Critical Thinking Questions
                                                    </h3>
                                                    <p className="text-sm text-gray-600 mt-1">Click a ❓ button next to any section</p>
                                                </div>
                                                {/* Content */}
                                                <div className="flex-1 overflow-y-auto p-6">
                                                    {socraticActiveSection && socraticQuestions[socraticActiveSection] ? (
                                                        <div className="space-y-4">
                                                            {/* Section Header */}
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-sm font-medium text-purple-700 bg-purple-100 px-3 py-1 rounded-full">
                                                                    {socraticActiveSection}
                                                                </span>
                                                                <button
                                                                    onClick={() => setSocraticActiveSection(null)}
                                                                    className="text-gray-400 hover:text-gray-600"
                                                                >×</button>
                                                            </div>

                                                            {/* Category Badge */}
                                                            {socraticQuestions[socraticActiveSection].categoryLabel && (
                                                                <div className="inline-block px-2 py-1 bg-indigo-100 text-indigo-700 text-xs font-medium rounded-full">
                                                                    {socraticQuestions[socraticActiveSection].categoryLabel}
                                                                </div>
                                                            )}

                                                            {/* Question */}
                                                            <div className="bg-purple-50 rounded-lg p-4 border border-purple-200">
                                                                <p className="text-xs font-medium text-purple-700 mb-2">Question:</p>
                                                                <p className="text-gray-800">{socraticQuestions[socraticActiveSection].question}</p>
                                                            </div>

                                                            {/* Initial Answer Input */}
                                                            {socraticQuestions[socraticActiveSection].status === 'question_generated' && (
                                                                <div className="space-y-3">
                                                                    <textarea
                                                                        value={socraticInputAnswer}
                                                                        onChange={(e) => setSocraticInputAnswer(e.target.value)}
                                                                        placeholder="Write your answer..."
                                                                        className="w-full p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                                                        rows={4}
                                                                    />
                                                                    <button
                                                                        onClick={() => submitSocraticAnswer(false)}
                                                                        disabled={!socraticInputAnswer.trim() || socraticIsFeedbackLoading}
                                                                        className="w-full py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:bg-gray-300 disabled:cursor-not-allowed font-medium"
                                                                    >
                                                                        {socraticIsFeedbackLoading ? 'Getting feedback...' : 'Submit Answer'}
                                                                    </button>
                                                                </div>
                                                            )}

                                                            {/* Initial Answer Display */}
                                                            {socraticQuestions[socraticActiveSection].initialAnswer && (
                                                                <div className="bg-blue-50 rounded-lg p-4 border border-blue-200">
                                                                    <p className="text-xs font-medium text-blue-700 mb-2">Your Answer:</p>
                                                                    <p className="text-gray-800 whitespace-pre-wrap">{socraticQuestions[socraticActiveSection].initialAnswer}</p>
                                                                </div>
                                                            )}

                                                            {/* Loading */}
                                                            {socraticIsFeedbackLoading && (
                                                                <div className="flex items-center justify-center py-4">
                                                                    <div className="w-6 h-6 border-2 border-purple-200 border-t-purple-600 rounded-full animate-spin mr-3"></div>
                                                                    <span className="text-gray-500">Analyzing...</span>
                                                                </div>
                                                            )}

                                                            {/* Feedback */}
                                                            {socraticQuestions[socraticActiveSection].feedback && (
                                                                <div className="bg-amber-50 rounded-lg p-4 border border-amber-200">
                                                                    <p className="text-xs font-medium text-amber-700 mb-2">💡 Feedback:</p>
                                                                    <p className="text-gray-800 whitespace-pre-wrap">{socraticQuestions[socraticActiveSection].feedback}</p>
                                                                </div>
                                                            )}

                                                            {/* Revised Answer */}
                                                            {(socraticQuestions[socraticActiveSection].status === 'feedback_received' ||
                                                              socraticQuestions[socraticActiveSection].status === 'revised_answered') && (
                                                                <div className="pt-4 border-t border-gray-200">
                                                                    {socraticQuestions[socraticActiveSection].revisedAnswer ? (
                                                                        <div className="bg-green-50 rounded-lg p-4 border border-green-200">
                                                                            <p className="text-xs font-medium text-green-700 mb-2">✅ Revised Answer:</p>
                                                                            <p className="text-gray-800 whitespace-pre-wrap">{socraticQuestions[socraticActiveSection].revisedAnswer}</p>
                                                                        </div>
                                                                    ) : (
                                                                        <div className="space-y-3">
                                                                            <p className="text-sm text-gray-600">Revise your answer (optional):</p>
                                                                            <textarea
                                                                                value={socraticRevisedAnswer}
                                                                                onChange={(e) => setSocraticRevisedAnswer(e.target.value)}
                                                                                placeholder="Revised answer..."
                                                                                className="w-full p-3 border border-gray-300 rounded-lg resize-none focus:ring-2 focus:ring-green-500 focus:border-transparent"
                                                                                rows={4}
                                                                            />
                                                                            <button
                                                                                onClick={() => submitSocraticAnswer(true)}
                                                                                disabled={!socraticRevisedAnswer.trim()}
                                                                                className="w-full py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-300 disabled:cursor-not-allowed font-medium"
                                                                            >
                                                                                Submit Revision
                                                                            </button>
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                        </div>
                                                    ) : socraticShowCategorySelector && socraticActiveSection ? (
                                                        <div className="space-y-4">
                                                            {/* Section Header */}
                                                            <div className="flex items-center justify-between">
                                                                <span className="text-sm font-medium text-purple-700 bg-purple-100 px-3 py-1 rounded-full">
                                                                    {socraticActiveSection}
                                                                </span>
                                                                <button
                                                                    onClick={() => {
                                                                        setSocraticShowCategorySelector(false);
                                                                        setSocraticActiveSection(null);
                                                                    }}
                                                                    className="text-gray-400 hover:text-gray-600"
                                                                >×</button>
                                                            </div>

                                                            <p className="text-sm font-medium text-gray-700">Select a question type:</p>
                                                            <div className="space-y-2">
                                                                {socraticCategories.map(cat => (
                                                                    <button
                                                                        key={cat.id}
                                                                        onClick={() => setSocraticSelectedCategory(cat.id)}
                                                                        className={`w-full text-left p-3 rounded-lg border transition-all ${
                                                                            socraticSelectedCategory === cat.id
                                                                                ? 'border-purple-500 bg-purple-50 ring-2 ring-purple-200'
                                                                                : 'border-gray-200 hover:border-purple-300 hover:bg-purple-50/50'
                                                                        }`}
                                                                    >
                                                                        <div className="font-medium text-sm text-gray-800">{cat.label}</div>
                                                                        <div className="text-xs text-gray-500 mt-1">{cat.description}</div>
                                                                    </button>
                                                                ))}
                                                            </div>
                                                            <button
                                                                onClick={() => generateSocraticQuestion(socraticActiveSection, socraticSelectedCategory)}
                                                                disabled={!socraticSelectedCategory}
                                                                className="w-full py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:bg-gray-300 disabled:cursor-not-allowed font-medium"
                                                            >
                                                                Generate Question
                                                            </button>
                                                        </div>
                                                    ) : socraticIsGenerating ? (
                                                        <div className="flex flex-col items-center justify-center h-full">
                                                            <div className="w-10 h-10 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin mb-4"></div>
                                                            <p className="text-gray-600">Generating question...</p>
                                                        </div>
                                                    ) : isCustomPdf && customPdfData?.sections ? (
                                                        /* Custom PDF: Show section list to select */
                                                        <div className="space-y-4">
                                                            <p className="text-sm text-gray-600 mb-4">Select a section to generate a critical thinking question:</p>
                                                            <div className="space-y-2">
                                                                {customPdfData.sections
                                                                    .filter(section => {
                                                                        const name = section.sectionName.toLowerCase();
                                                                        return !name.includes('abstract') && !name.includes('reference') && !name.includes('acknowledg');
                                                                    })
                                                                    .map((section, idx) => (
                                                                    <button
                                                                        key={idx}
                                                                        onClick={() => {
                                                                            setSocraticActiveSection(section.sectionName);
                                                                            setSocraticShowCategorySelector(true);
                                                                            goToPdfPage(section.startPage);
                                                                        }}
                                                                        className={`w-full text-left p-3 rounded-lg border transition-all ${
                                                                            socraticQuestions[section.sectionName]?.initialAnswer
                                                                                ? 'bg-green-50 border-green-300 hover:bg-green-100'
                                                                                : socraticQuestions[section.sectionName]
                                                                                    ? 'bg-yellow-50 border-yellow-300 hover:bg-yellow-100'
                                                                                    : 'bg-gray-50 border-gray-200 hover:bg-purple-50 hover:border-purple-300'
                                                                        }`}
                                                                    >
                                                                        <div className="flex items-center justify-between">
                                                                            <span className="font-medium text-gray-800">{section.sectionName}</span>
                                                                            <span className="text-xs text-gray-500">p.{section.startPage}-{section.endPage}</span>
                                                                        </div>
                                                                        {section.summary && (
                                                                            <p className="text-xs text-gray-500 mt-1 line-clamp-2">{section.summary}</p>
                                                                        )}
                                                                        {socraticQuestions[section.sectionName]?.initialAnswer ? (
                                                                            <span className="inline-block mt-2 text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">
                                                                                ✓ Answered
                                                                            </span>
                                                                        ) : socraticQuestions[section.sectionName] && (
                                                                            <span className="inline-block mt-2 text-xs bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full">
                                                                                ? Pending answer
                                                                            </span>
                                                                        )}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-col items-center justify-center h-full text-center">
                                                            <div className="text-5xl mb-4">🤔</div>
                                                            <p className="font-medium text-gray-700 mb-2">No question selected</p>
                                                            <p className="text-sm text-gray-500">Click a ❓ button next to any section in the paper</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    ) : (
                                        /* Other conditions: centered paper */
                                        pdfLoading ? (
                                            /* Loading state */
                                            <div className="w-full h-full flex items-center justify-center" style={{ minHeight: 'calc(100vh - 120px)' }}>
                                                <div className="text-center">
                                                    <svg className="animate-spin h-12 w-12 text-blue-600 mx-auto mb-4" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                    </svg>
                                                    <p className="text-gray-600 font-medium">Loading PDF...</p>
                                                </div>
                                            </div>
                                        ) : isCustomPdf && pdfRenderedPages.length > 0 ? (
                                            /* Custom PDF viewer - embed for text selection with activity tracking */
                                            <div
                                                ref={pdfContainerScrollRef}
                                                onScroll={handlePdfScroll}
                                                className="w-full h-full bg-gray-200"
                                                onMouseEnter={handlePdfAreaEnter}
                                                onMouseLeave={handlePdfAreaLeave}
                                                onWheel={handlePdfWheel}
                                            >
                                                <iframe
                                                    src="papers/hafner2014/paper.pdf"
                                                    title="Paper"
                                                    style={{ width: '100%', height: '100%', border: 0, display: 'block' }}
                                                />
                                            </div>
                                        ) : isCustomPdf && customPdfData?.base64 ? (
                                            /* PDF data exists but Blob URL not created yet - show loading */
                                            <div className="w-full h-full flex items-center justify-center" style={{ minHeight: 'calc(100vh - 120px)' }}>
                                                <div className="text-center">
                                                    <svg className="animate-spin h-12 w-12 text-blue-600 mx-auto mb-4" viewBox="0 0 24 24">
                                                        <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                                        <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                    </svg>
                                                    <p className="text-gray-600 font-medium">Rendering pages...</p>
                                                </div>
