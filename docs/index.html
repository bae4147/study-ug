<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="flow.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <p class="text-gray-600">Loading…</p>

<script>
(function () {
    firebase.initializeApp({
        apiKey: "AIzaSyBd4MI5xzSE4QYIjxe_DlBKnuuv-aiS3nk",
        authDomain: "study-ug-osu.firebaseapp.com",
        projectId: "study-ug-osu",
        storageBucket: "study-ug-osu.firebasestorage.app",
        messagingSenderId: "115284332881",
        appId: "1:115284332881:web:351ebb762bad162fccc370"
    });
    var db = firebase.firestore();

    var toLogin = function () {
        window.location.replace('login.html' + window.location.search);
    };

    firebase.auth().onAuthStateChanged(function (user) {
        if (!user) { toLogin(); return; }

        // Signed in already. login.html mints a session for whoever arrives, so
        // send a part-way participant back to their own session instead; everything
        // else (a first visit, or a run that is already finished) is login's call.
        STUDY_FLOW.readSessions(db, user.uid)
            .then(function (state) {
                var fresh = STUDY_FLOW.isTestAccount(user.email);
                if (!fresh && state.finished) { toLogin(); return; }
                if (!state.open) { toLogin(); return; }

                STUDY_FLOW.remember(state.open.id);
                var url = STUDY_FLOW.urlFor(user.uid, state.open);
                if (url) { window.location.replace(url); } else { toLogin(); }
            })
            .catch(function (e) {
                console.error('Could not look up an open session:', e);
                toLogin();
            });
    });
})();
</script>
</body>
</html>
