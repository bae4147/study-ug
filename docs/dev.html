<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Study UG — Trial</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
<div class="bg-white rounded-xl shadow p-8 max-w-md w-full">
  <p class="text-xs font-semibold tracking-wide uppercase text-red-700 mb-2">Internal — not for participants</p>
  <h1 class="text-2xl font-bold text-gray-800 mb-2">Trial run</h1>
  <p class="text-gray-600 mb-6">Walks the whole study as a fresh test participant, skipping the sign-in email.</p>
  <div id="error" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded text-red-700 text-sm"></div>
  <button id="fresh" class="w-full px-6 py-3 rounded-lg font-medium bg-blue-600 text-white hover:bg-blue-700">Start trial</button>
</div>
<script>
(function () {
  var DEV_TOKEN = 'ANzSqCQ_8-xjt_zRIUfkzlFQ';
  var FN = 'https://us-central1-study-ug-osu.cloudfunctions.net/devLogin';
  document.getElementById('fresh').addEventListener('click', function () {
    var b = this; b.disabled = true; b.textContent = 'Setting up\u2026';
    var email = 'tester-' + Date.now().toString(36) + '@example.com';
    fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, token: DEV_TOKEN, continueUrl: location.href.replace(/dev\.html.*$/, 'login.html') }) })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (!res.ok) throw new Error(res.error || 'devLogin failed');
        localStorage.setItem('emailForSignIn', email);
        location.href = res.link;
      })
      .catch(function (err) {
        var e = document.getElementById('error'); e.textContent = err.message; e.classList.remove('hidden');
        b.disabled = false; b.textContent = 'Start trial';
      });
  });
})();
</script>
</body>
</html>
