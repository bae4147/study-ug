<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment - Comprehension Quiz</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="no-back.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyBd4MI5xzSE4QYIjxe_DlBKnuuv-aiS3nk",
            authDomain: "study-ug-osu.firebaseapp.com",
            projectId: "study-ug-osu",
            storageBucket: "study-ug-osu.firebasestorage.app",
            messagingSenderId: "115284332881",
            appId: "1:115284332881:web:351ebb762bad162fccc370"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const QUIZ_SECONDS = 5 * 60;

        // 8 comprehension items on Häfner, Stock & Oberst (2014), cut down from the
        // 15 marked final_15 in quiz_review.csv: the detail-recall items went first
        // (a number, a term, a one-sentence design note), leaving the study's logic
        // and its main results. The ids carry the review file's numbering.
        const QUIZ_QUESTIONS = [
            {
                id: 1,   // quiz_review.csv #5
                question: "According to the results, how did the students' perceived control of time change two weeks after the training?",
                options: [
                    "It reached its peak immediately and then declined by the fourth week.",
                    "It showed a significant immediate increase.",
                    "It decreased as students struggled to implement the new tools.",
                    "It remained unchanged with only a non-significant upward trend."
                ],
                correctAnswer: "It remained unchanged with only a non-significant upward trend.",
                type: "multiple_choice"
            },
            {
                id: 2,   // quiz_review.csv #6
                question: "Why did the researchers also measure \"demands\"?",
                options: [
                    "To make sure all participants had a similar workload.",
                    "To test whether the training reduced students' workload.",
                    "As a stress-related variable the training should not change, so changes in the other variables could be attributed to the training.",
                    "To test whether demands explained the link between time management and stress."
                ],
                correctAnswer: "As a stress-related variable the training should not change, so changes in the other variables could be attributed to the training.",
                type: "multiple_choice"
            },
            {
                id: 3,   // quiz_review.csv #8
                question: "Which participants showed the largest training effects?",
                options: [
                    "Students in later semesters of their studies",
                    "Students who reported the highest demands before training",
                    "Students with no or little prior time management experience",
                    "Students with moderate prior time management experience"
                ],
                correctAnswer: "Students with no or little prior time management experience",
                type: "multiple_choice"
            },
            {
                id: 4,   // quiz_review.csv #9
                question: "In the comparison of the pre-test and the four-week post-test, what was the observed effect on the 'tension' scale?",
                options: [
                    "Tension decreased initially but returned to baseline levels by week four.",
                    "Tension significantly increased as the semester progressed toward exams.",
                    "Tension levels remained exactly the same throughout the month.",
                    "There was a significant decrease in reported tension."
                ],
                correctAnswer: "There was a significant decrease in reported tension.",
                type: "multiple_choice"
            },
            {
                id: 5,   // quiz_review.csv #13
                question: "Which of the following is a recognized limitation of the study mentioned by the authors in the Discussion?",
                options: [
                    "The sample size was small, requiring more studies to reach robust conclusions.",
                    "The intervention was too long, leading to student boredom.",
                    "The training failed to change time management behavior.",
                    "Participants were only selected from the psychology department."
                ],
                correctAnswer: "The sample size was small, requiring more studies to reach robust conclusions.",
                type: "multiple_choice"
            },
            {
                id: 6,   // quiz_review.csv #15
                question: "Regarding the theoretical framework, how is 'perceived control of time' described in relation to stress?",
                options: [
                    "As an outcome that is completely independent of time management behavior.",
                    "As a potential mediator that, when increased, leads to reduced stress levels.",
                    "As an external stressor that increases workload.",
                    "As a fixed personality trait that cannot be changed by behavior."
                ],
                correctAnswer: "As a potential mediator that, when increased, leads to reduced stress levels.",
                type: "multiple_choice"
            },
            {
                id: 7,   // quiz_review.csv #17
                question: "What change was observed in the participants' reported 'time management behavior' four weeks after the training compared to before it?",
                options: [
                    "A significant decrease occurred because students felt overwhelmed by new rules.",
                    "A significant increase was reported.",
                    "There was no change, suggesting the training was not transferred to daily life.",
                    "Behavior returned to pre-training levels after an initial spike."
                ],
                correctAnswer: "A significant increase was reported.",
                type: "multiple_choice"
            },
            {
                id: 8,   // quiz_review.csv #23
                question: "The authors suggest that orientation reduces stress. How does the training provide this orientation?",
                options: [
                    "By assigning each student a faculty mentor for guidance.",
                    "By clarifying goals and developing step-by-step strategies to achieve them.",
                    "By providing a map of the university campus to new students.",
                    "By reducing the total number of subjects a student must study."
                ],
                correctAnswer: "By clarifying goals and developing step-by-step strategies to achieve them.",
                type: "multiple_choice"
            }
        ];

        // Pure display. The countdown lives in Quiz, because reaching zero has to
        // submit, and a callback passed down here would close over a stale submit.
        function Timer({ left }) {
            const mm = String(Math.floor(left / 60)).padStart(2, '0');
            const ss = String(left % 60).padStart(2, '0');
            return (
                <div className={`px-4 py-2 rounded-lg font-mono text-lg font-bold ${left <= 30 ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-700'}`}>
                    ⏱ {mm}:{ss}
                </div>
            );
        }

        function Quiz() {
            const [currentUser, setCurrentUser] = useState(null);
            const [checkingAuth, setCheckingAuth] = useState(true);

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId') || sessionStorage.getItem('currentSessionId');
            const condition = urlParams.get('condition');
            const paper = urlParams.get('paper');
            const mode = urlParams.get('mode');

            const [phase, setPhase] = useState('guide'); // guide | quiz
            const [answers, setAnswers] = useState({});
            const [confidence, setConfidence] = useState('');
            const [showFinishPopup, setShowFinishPopup] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [timeLeft, setTimeLeft] = useState(QUIZ_SECONDS);
            const startedAtRef = useRef(null);
            const deadlineRef = useRef(null);
            // State guards re-render too late to stop a second submit fired in the
            // same tick (the deadline and a click can land together), so the real
            // lock is a ref.
            const submittedRef = useRef(false);
            const submitRef = useRef(null);

            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (!user) {
                        window.location.href = 'login.html';
                        return;
                    }
                    setCurrentUser(user);
                    setCheckingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            const handleAnswer = (questionId, answer) => {
                setAnswers(prev => ({ ...prev, [questionId]: answer }));
            };

            // Each tick recomputes the remaining time from a fixed deadline instead of
            // counting ticks. Browsers slow timers down in a tab nobody is looking at,
            // and a counter would simply lose those seconds; reading the clock makes
            // the display correct itself the moment the tab comes back.
            useEffect(() => {
                if (phase !== 'quiz') return;
                const tick = () => {
                    const ms = deadlineRef.current - Date.now();
                    setTimeLeft(Math.max(0, Math.ceil(ms / 1000)));
                };
                tick();
                const id = setInterval(tick, 250);
                document.addEventListener('visibilitychange', tick);
                return () => {
                    clearInterval(id);
                    document.removeEventListener('visibilitychange', tick);
                };
            }, [phase]);

            // Time is up: hand in whatever is on screen. Unanswered items are graded
            // as incorrect, which is what a timed closed-book test should do.
            useEffect(() => {
                if (phase !== 'quiz' || timeLeft > 0 || submittedRef.current) return;
                setShowFinishPopup(false);
                if (submitRef.current) submitRef.current(true);
            }, [phase, timeLeft]);

            const submitQuiz = async (autoSubmitted = false) => {
                if (submittedRef.current) return;
                submittedRef.current = true;
                setIsSubmitting(true);

                const duration = startedAtRef.current ? Date.now() - startedAtRef.current : null;

                // Auto-grade. "Not Sure" is counted separately: it is a deliberate
                // abstention, not a wrong guess.
                let correctCount = 0;
                let notSureCount = 0;
                const gradingDetails = QUIZ_QUESTIONS.map(q => {
                    const userAnswer = answers[q.id];
                    const isNotSure = userAnswer === 'Not Sure';
                    const isCorrect = !isNotSure && userAnswer === q.correctAnswer;
                    if (isCorrect) correctCount++;
                    if (isNotSure) notSureCount++;
                    return { questionId: q.id, userAnswer: userAnswer || null, correctAnswer: q.correctAnswer, isCorrect, isNotSure };
                });
                const totalQuestions = QUIZ_QUESTIONS.length;
                const accuracy = totalQuestions ? parseFloat(((correctCount / totalQuestions) * 100).toFixed(1)) : 0;

                try {
                    if (!sessionId) throw new Error('Missing sessionId');

                    const sessionRef = db.collection('users').doc(currentUser.uid).collection('sessions').doc(sessionId);
                    await sessionRef.set({
                        quiz: {
                            answers,
                            confidence: parseInt(confidence) || null,
                            duration,
                            gradingDetails,
                            correctCount,
                            notSureCount,
                            totalQuestions,
                            accuracy,
                            autoSubmitted,
                            submittedAt: new Date().toISOString()
                        },
                        currentPhase: 'survey2'
                    }, { merge: true });

                    console.log('✅ Quiz saved:', { correctCount, totalQuestions, accuracy });

                    const params = new URLSearchParams({ sessionId, mode, condition, paper });
                    window.location.replace(`survey2.html?${params.toString()}`);
                } catch (error) {
                    console.error('Error saving quiz:', error);
                    alert('Failed to save. Please try again.');
                    submittedRef.current = false;
                    setIsSubmitting(false);
                }
            };

            // Keep the deadline pointed at the current closure, so it submits the
            // answers on screen rather than the ones from the render it was set up in.
            submitRef.current = submitQuiz;

            if (checkingAuth) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <svg className="animate-spin h-10 w-10 text-purple-600 mx-auto mb-4" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            if (phase === 'guide') {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-purple-50 to-pink-100 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl p-12 max-w-3xl w-full">
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">📝</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Comprehension Quiz</h1>
                            </div>

                            <div className="space-y-6 mb-8">
                                <div className="bg-gray-50 rounded-lg p-6">
                                    <h3 className="font-bold text-lg text-gray-800 mb-2">Guide</h3>
                                    <ul className="list-disc pl-5 space-y-1 text-gray-700">
                                        <li>Answer the questions based on your understanding of the article.</li>
                                        <li>This is closed-book: the article and the GenAI tools are no longer available.</li>
                                        <li>If you're unsure, please select "Not Sure" instead of guessing.</li>
                                    </ul>
                                </div>

                                <div className="bg-gray-50 rounded-lg p-6">
                                    <h3 className="font-bold text-lg text-gray-800 mb-2">Time Limit</h3>
                                    <p className="text-3xl font-bold text-purple-600">{Math.round(QUIZ_SECONDS / 60)} min</p>
                                    <p className="text-sm text-gray-600 mt-2">When the time is up, your answers are submitted automatically.</p>
                                </div>
                            </div>

                            <button
                                onClick={() => {
                                    startedAtRef.current = Date.now();
                                    deadlineRef.current = startedAtRef.current + QUIZ_SECONDS * 1000;
                                    setPhase('quiz');
                                }}
                                className="w-full px-8 py-4 bg-purple-600 text-white rounded-lg hover:bg-purple-700 text-lg font-medium"
                            >
                                Start →
                            </button>
                        </div>
                    </div>
                );
            }

            const answeredCount = Object.keys(answers).length;

            return (
                <div className="min-h-screen bg-gray-50">
                    <div className="bg-white shadow-md px-6 py-4 border-b-2 flex items-center justify-between sticky top-0 z-40">
                        <div>
                            <h2 className="text-lg font-bold text-gray-800">Comprehension Quiz</h2>
                            <p className="text-sm text-gray-600">Closed-book</p>
                        </div>
                        <div className="flex items-center space-x-4">
                            <Timer left={timeLeft} />
                            <button
                                onClick={() => {
                                    // Once the clock has run out the answers are already
                                    // being handed in; the only reason to click is a retry
                                    // after a failed save, so the checks are skipped.
                                    if (timeLeft === 0) {
                                        submitQuiz(true);
                                        return;
                                    }
                                    if (answeredCount < QUIZ_QUESTIONS.length) {
                                        alert(`Please answer all questions before submitting. (${answeredCount}/${QUIZ_QUESTIONS.length} answered)`);
                                        return;
                                    }
                                    if (!confidence) {
                                        alert('Please rate your confidence in your quiz answers.');
                                        return;
                                    }
                                    setShowFinishPopup(true);
                                }}
                                disabled={isSubmitting}
                                className="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 font-medium disabled:bg-green-300"
                            >
                                {isSubmitting ? 'Submitting…' : 'Submit Quiz'}
                            </button>
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto p-8">
                        <div className="space-y-6">
                            {QUIZ_QUESTIONS.map((q, idx) => (
                                <div key={q.id} className="bg-white rounded-lg shadow-md p-6">
                                    <div className="flex items-start space-x-3 mb-4">
                                        <span className="flex-shrink-0 w-8 h-8 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold">
                                            {idx + 1}
                                        </span>
                                        <div className="flex-1">
                                            <p className="font-medium text-gray-900 mb-2">{q.question}</p>

                                            <div className="space-y-2 mt-4">
                                                {q.options?.map((option, optIdx) => (
                                                    <label key={optIdx} className="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer border border-gray-200">
                                                        <input
                                                            type="radio"
                                                            name={`question-${q.id}`}
                                                            value={option}
                                                            checked={answers[q.id] === option}
                                                            onChange={(e) => handleAnswer(q.id, e.target.value)}
                                                            className="w-4 h-4"
                                                        />
                                                        <span className="text-gray-700">{option}</span>
                                                    </label>
                                                ))}
                                                <p className="text-xs text-gray-500 mt-4 mb-2">If you're not sure, please select 'Not Sure' below.</p>
                                                <label className="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-100 cursor-pointer border border-dashed border-gray-400 bg-gray-50">
                                                    <input
                                                        type="radio"
                                                        name={`question-${q.id}`}
                                                        value="Not Sure"
                                                        checked={answers[q.id] === 'Not Sure'}
                                                        onChange={(e) => handleAnswer(q.id, e.target.value)}
                                                        className="w-4 h-4"
                                                    />
                                                    <span className="text-gray-500 italic">Not Sure</span>
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            ))}

                            <div className="bg-white rounded-lg shadow-md p-6 mt-8 border-t-4 border-blue-500">
                                <div className="mb-4">
                                    <p className="font-medium text-gray-900 mb-2">
                                        How confident are you that you answered the quiz questions correctly? *
                                    </p>
                                </div>
                                <div className="flex items-center justify-between">
                                    <span className="text-xs text-gray-500">Not at all confident</span>
                                    <div className="flex space-x-1">
                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                            <button
                                                key={value}
                                                type="button"
                                                onClick={() => setConfidence(value.toString())}
                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                    confidence === value.toString()
                                                        ? 'bg-blue-600 text-white'
                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                }`}
                                            >
                                                {value}
                                            </button>
                                        ))}
                                    </div>
                                    <span className="text-xs text-gray-500">Extremely confident</span>
                                </div>
                            </div>
                        </div>

                        <div className="mt-8 p-4 bg-gray-100 rounded-lg">
                            <p className="text-sm text-gray-600">
                                Progress: {answeredCount} / {QUIZ_QUESTIONS.length} questions answered
                            </p>
                        </div>
                    </div>

                    {timeLeft === 0 && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full mx-4 text-center">
                                <div className="text-4xl mb-3">⏱</div>
                                <h3 className="text-2xl font-bold text-gray-800 mb-2">Time is up</h3>
                                <p className="text-gray-600">
                                    {isSubmitting
                                        ? 'Submitting your answers…'
                                        : 'Your answers are being submitted. If nothing happens, press Submit Quiz.'}
                                </p>
                            </div>
                        </div>
                    )}

                    {showFinishPopup && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl p-8 max-w-md w-full mx-4">
                                <h3 className="text-2xl font-bold text-gray-800 mb-4">Submit the quiz?</h3>
                                <p className="text-gray-600 mb-6">You will not be able to change your answers.</p>
                                <div className="flex space-x-4">
                                    <button
                                        onClick={() => setShowFinishPopup(false)}
                                        className="flex-1 px-4 py-3 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 font-medium"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={() => { setShowFinishPopup(false); submitQuiz(); }}
                                        disabled={isSubmitting}
                                        className="flex-1 px-4 py-3 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium disabled:bg-purple-300"
                                    >
                                        {isSubmitting ? 'Saving...' : 'Confirm'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<Quiz />, document.getElementById('root'));
    </script>
</body>
</html>
