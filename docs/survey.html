<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Assignment - Post-Reading Survey</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="conditions.js"></script>
    <script src="no-back.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBd4MI5xzSE4QYIjxe_DlBKnuuv-aiS3nk",
            authDomain: "study-ug-osu.firebaseapp.com",
            projectId: "study-ug-osu",
            storageBucket: "study-ug-osu.firebasestorage.app",
            messagingSenderId: "115284332881",
            appId: "1:115284332881:web:351ebb762bad162fccc370"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function Survey() {
            // Auth state
            const [currentUser, setCurrentUser] = useState(null);
            const [checkingAuth, setCheckingAuth] = useState(true);

            // Get session info from URL
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId') || sessionStorage.getItem('currentSessionId');
            const condition = urlParams.get('condition');
            const paper = urlParams.get('paper');
            const mode = urlParams.get('mode');

            // Auth guard
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((user) => {
                    if (!user) {
                        window.location.href = 'login.html';
                        return;
                    }
                    setCurrentUser(user);
                    setCheckingAuth(false);
                });
                return () => unsubscribe();
            }, []);

            // Section 1: Perceived task load
            const [mentalDemand, setMentalDemand] = useState('');

            // Section 3: LLM Usefulness (only for with_llm conditions)
            const [llmOverallUsefulness, setLlmOverallUsefulness] = useState('');
            const [llmConceptHelp, setLlmConceptHelp] = useState('');
            const [llmFindingsHelp, setLlmFindingsHelp] = useState('');
            const [llmPracticalHelp, setLlmPracticalHelp] = useState('');
            const [llmTimeSaving, setLlmTimeSaving] = useState('');

            // Section 4: GenAI experiences (stored under `llmTrust`)
            const TRUST_ITEMS = [
                { key: 'relyAlways', text: 'I can always rely on the GenAI when understanding articles.' },
                { key: 'comfortActing', text: 'I have no reservations about acting on the information provided by the GenAI.' },
                { key: 'comfortUsing', text: 'I have no hesitation in using the information provided by the GenAI.' },
                { key: 'confidentWithoutDetails', text: "The content generated by the GenAI makes me feel confident about an article even when I can't identify supporting details in the text." },
                { key: 'relyForImportance', text: 'I rely on the GenAI to tell me what matters instead of deciding for myself what is important in the article.' },
                { key: 'assumeAccurate', text: 'I assume information from the GenAI is accurate unless something looks obviously wrong.' },
                { key: 'treatAsFinished', text: 'I treat the GenAI output as a finished product rather than a draft I need to evaluate.' }
            ];
            const [trustAnswers, setTrustAnswers] = useState({});
            const trustComplete = TRUST_ITEMS.every(i => trustAnswers[i.key]);

            // What "GenAI" means depends on the arm: the multimodal arms had the chatbot
            // plus video, podcast and infographic; anything else had the chatbot only.
            const hadMultimodal = conditionCaps(condition).multimodal;
            const genAiDefinition = hadMultimodal
                ? 'the AI Chatbot, Video Overview, Audio Overview (podcast), and Infographic provided during the reading session'
                : 'the AI Chatbot provided during the reading session';

            // GenAI Resource Helpfulness (0 = not used, 1-7 scale)
            const [chatbotHelpfulness, setChatbotHelpfulness] = useState('');
            const [infographicHelpfulness, setInfographicHelpfulness] = useState('');
            const [videoHelpfulness, setVideoHelpfulness] = useState('');
            const [podcastHelpfulness, setPodcastHelpfulness] = useState('');

            const [isSubmitting, setIsSubmitting] = useState(false);

            // Section 5, for the customising arms only. Whether they actually made
            // their own version is read off the job records rather than asked, so
            // the satisfaction items go only to those who used it, and the others
            // are asked why not.
            const canCustomize = conditionCaps(condition).customize;
            const CUSTOM_ITEMS = [
                { key: 'reflectedRequest', text: 'The content I customized reflected what I asked for.' },
                { key: 'moreUseful', text: 'Customizing the content made it more useful for understanding the article.' },
                { key: 'preferredOwn', text: 'I preferred my customized version over the original.' },
                { key: 'worthWait', text: 'The wait for my customized content was worth it.' }
            ];
            const [customMade, setCustomMade] = useState(null);   // null = still checking
            const [customAnswers, setCustomAnswers] = useState({});
            const [customWhyNot, setCustomWhyNot] = useState('');
            const customComplete = CUSTOM_ITEMS.every(i => customAnswers[i.key]);

            useEffect(() => {
                if (!canCustomize || !currentUser || !sessionId) return;
                db.collection('users').doc(currentUser.uid).collection('sessions').doc(sessionId)
                    .collection('customJobs').get()
                    .then(snap => {
                        const made = [];
                        snap.forEach(d => { if (d.data().status === 'done') made.push(d.id); });
                        setCustomMade(made);
                    })
                    .catch(err => { console.error('Could not read customisation jobs:', err); setCustomMade([]); });
            }, [canCustomize, currentUser, sessionId]);
            const usedCustom = !!customMade && customMade.length > 0;

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (isSubmitting) return;

                if (!mentalDemand) {
                    alert('Please complete all required fields.');
                    return;
                }
                if (!llmOverallUsefulness || !llmConceptHelp || !llmFindingsHelp || !llmPracticalHelp || !llmTimeSaving || !trustComplete) {
                    alert('Please complete all GenAI-related questions.');
                    return;
                }
                const helpfulnessMissing = chatbotHelpfulness === '' ||
                    (hadMultimodal && (infographicHelpfulness === '' || videoHelpfulness === '' || podcastHelpfulness === ''));
                if (helpfulnessMissing) {
                    alert('Please rate how helpful each GenAI resource was for your learning.');
                    return;
                }
                if (canCustomize && usedCustom && !customComplete) {
                    alert('Please answer the questions about the content you customized.');
                    return;
                }

                setIsSubmitting(true);

                const surveyData = {
                    nasaTLX: {
                        mentalDemand: parseInt(mentalDemand)
                    },
                    llmUsefulness: {
                        overall: parseInt(llmOverallUsefulness),
                        conceptHelp: parseInt(llmConceptHelp),
                        findingsHelp: parseInt(llmFindingsHelp),
                        practicalHelp: parseInt(llmPracticalHelp),
                        timeSaving: parseInt(llmTimeSaving)
                    },
                    llmTrust: Object.fromEntries(TRUST_ITEMS.map(i => [i.key, parseInt(trustAnswers[i.key])])),
                    resourceHelpfulness: {
                        chatbot: parseInt(chatbotHelpfulness),
                        infographic: hadMultimodal ? parseInt(infographicHelpfulness) : null,
                        video: hadMultimodal ? parseInt(videoHelpfulness) : null,
                        podcast: hadMultimodal ? parseInt(podcastHelpfulness) : null
                    },
                    customization: canCustomize ? {
                        made: customMade || [],
                        ratings: usedCustom ? Object.fromEntries(CUSTOM_ITEMS.map(i => [i.key, parseInt(customAnswers[i.key])])) : null,
                        whyNot: usedCustom ? null : (customWhyNot.trim() || null)
                    } : null,
                    completedAt: new Date().toISOString()
                };

                try {
                    if (!sessionId) {
                        throw new Error('Missing sessionId');
                    }

                    console.log('💾 Survey data:', surveyData);

                    const sessionRef = db.collection('users').doc(currentUser.uid).collection('sessions').doc(sessionId);
                    await sessionRef.set({
                        survey: surveyData,
                        currentPhase: 'post_task'
                    }, { merge: true });

                    console.log('✅ Survey saved');

                    const params = new URLSearchParams({ sessionId, mode, condition, paper });
                    window.location.replace(`post-task.html?${params.toString()}`);

                } catch (error) {
                    console.error('Error saving survey:', error);
                    alert('Failed to save survey. Please try again.');
                    setIsSubmitting(false);
                }
            };

            if (checkingAuth) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-100 flex items-center justify-center">
                        <div className="text-center">
                            <svg className="animate-spin h-10 w-10 text-blue-600 mx-auto mb-4" viewBox="0 0 24 24">
                                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none"></circle>
                                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <p className="text-gray-600">Loading...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-100 py-8 px-4">
                    <div className="max-w-3xl mx-auto">
                        <div className="bg-white rounded-xl shadow-2xl p-8">
                            {/* Header */}
                            <div className="text-center mb-8">
                                <div className="text-5xl mb-4">📋</div>
                                <h1 className="text-3xl font-bold text-gray-800 mb-2">Post-reading survey</h1>
                                <p className="text-gray-600">Please evaluate your experience with the reading task.</p>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-8">
{/* Section 1: NASA-TLX */}
                                <div className="border-b pb-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Section 1. Perceived Task Load</h2>
                                    <p className="text-sm text-gray-600 mb-4">Please rate the following aspects of the reading task you just completed.</p>

                                    <div className="space-y-8">
                                        <div>
                                            <label className="block text-sm font-bold text-gray-800 mb-2">
                                                Mental Demand: How mentally demanding was the task?*
                                            </label>
                                            <p className="text-xs text-gray-600 mb-3">(e.g., thinking, deciding, understanding, remembering)</p>
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs text-gray-500">Very Low</span>
                                                <div className="flex space-x-1">
                                                    {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                        <button
                                                            key={value}
                                                            type="button"
                                                            onClick={() => setMentalDemand(value.toString())}
                                                            className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                mentalDemand === value.toString()
                                                                    ? 'bg-blue-600 text-white'
                                                                    : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                            }`}
                                                        >
                                                            {value}
                                                        </button>
                                                    ))}
                                                </div>
                                                <span className="text-xs text-gray-500">Very High</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

{/* Section 3: LLM Usefulness */}
                                <div className="border-b pb-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Section 2. Usefulness of GenAI</h2>
                                    <p className="text-sm text-gray-600 mb-2">Please rate your experience during the task.</p>
                                    <p className="text-sm text-gray-600 mb-4">
                                        <span>* <strong className="text-gray-800">GenAI</strong> refers to {genAiDefinition}.</span>
                                    </p>

                                        <div className="space-y-8">
                                            <div>
                                                <label className="block text-sm font-bold text-gray-800 mb-2">
                                                    How useful was the GenAI for reading and understanding the article?*
                                                </label>
                                                <div className="flex items-center justify-between mt-3">
                                                    <span className="text-xs text-gray-500">Not at all useful</span>
                                                    <div className="flex space-x-1">
                                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                            <button
                                                                key={value}
                                                                type="button"
                                                                onClick={() => setLlmOverallUsefulness(value.toString())}
                                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                    llmOverallUsefulness === value.toString()
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {value}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <span className="text-xs text-gray-500">Extremely useful</span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-gray-800 mb-2">
                                                    How helpful was the GenAI for understanding difficult concepts or terminology?*
                                                </label>
                                                <div className="flex items-center justify-between mt-3">
                                                    <span className="text-xs text-gray-500">Not at all helpful</span>
                                                    <div className="flex space-x-1">
                                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                            <button
                                                                key={value}
                                                                type="button"
                                                                onClick={() => setLlmConceptHelp(value.toString())}
                                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                    llmConceptHelp === value.toString()
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {value}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <span className="text-xs text-gray-500">Extremely helpful</span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-gray-800 mb-2">
                                                    How helpful was the GenAI for understanding the research findings?*
                                                </label>
                                                <div className="flex items-center justify-between mt-3">
                                                    <span className="text-xs text-gray-500">Not at all helpful</span>
                                                    <div className="flex space-x-1">
                                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                            <button
                                                                key={value}
                                                                type="button"
                                                                onClick={() => setLlmFindingsHelp(value.toString())}
                                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                    llmFindingsHelp === value.toString()
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {value}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <span className="text-xs text-gray-500">Extremely helpful</span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-gray-800 mb-2">
                                                    How helpful was the GenAI for understanding practical applications?*
                                                </label>
                                                <div className="flex items-center justify-between mt-3">
                                                    <span className="text-xs text-gray-500">Not at all helpful</span>
                                                    <div className="flex space-x-1">
                                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                            <button
                                                                key={value}
                                                                type="button"
                                                                onClick={() => setLlmPracticalHelp(value.toString())}
                                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                    llmPracticalHelp === value.toString()
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {value}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <span className="text-xs text-gray-500">Extremely helpful</span>
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-sm font-bold text-gray-800 mb-2">
                                                    How helpful was the GenAI for saving your time?*
                                                </label>
                                                <div className="flex items-center justify-between mt-3">
                                                    <span className="text-xs text-gray-500">Not at all helpful</span>
                                                    <div className="flex space-x-1">
                                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                            <button
                                                                key={value}
                                                                type="button"
                                                                onClick={() => setLlmTimeSaving(value.toString())}
                                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                    llmTimeSaving === value.toString()
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {value}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <span className="text-xs text-gray-500">Extremely helpful</span>
                                                </div>
                                            </div>
                                    </div>
                                </div>

{/* Section 4: GenAI experiences */}
                                <div className="border-b pb-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Section 3. GenAI experiences</h2>
                                    <p className="text-sm text-gray-600 mb-2">Please rate your experience during the task.</p>
                                    <p className="text-sm text-gray-600 mb-4">
                                        <span>* <strong className="text-gray-800">GenAI</strong> refers to {genAiDefinition}.</span>
                                    </p>

                                    <div className="space-y-8">
                                        {TRUST_ITEMS.map(item => (
                                            <div key={item.key}>
                                                <label className="block text-sm font-bold text-gray-800 mb-2">
                                                    {item.text} *
                                                </label>
                                                <div className="flex items-center justify-between mt-3">
                                                    <span className="text-xs text-gray-500">Strongly disagree</span>
                                                    <div className="flex space-x-1">
                                                        {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                            <button
                                                                key={value}
                                                                type="button"
                                                                onClick={() => setTrustAnswers(prev => ({ ...prev, [item.key]: value.toString() }))}
                                                                className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                    trustAnswers[item.key] === value.toString()
                                                                        ? 'bg-blue-600 text-white'
                                                                        : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                }`}
                                                            >
                                                                {value}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <span className="text-xs text-gray-500">Strongly agree</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>

{/* GenAI Resource Helpfulness Section */}
                                <div className="border-b pb-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Section 4. GenAI Resource Helpfulness</h2>
                                    <p className="text-sm text-gray-600 mb-4">Please rate how helpful {hadMultimodal ? 'each resource was' : 'the AI chatbot was'} for your learning.</p>
                                    <p className="text-xs text-gray-500 mb-4">0 = I did not use this resource, 1 = Not at all helpful, 7 = Extremely helpful</p>

                                    <div className="space-y-6">
                                        {/* AI Chatbot */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-800 mb-2">
                                                How helpful was the AI chatbot? *
                                            </label>
                                            <div className="flex items-center justify-between mt-3">
                                                <span className="text-xs text-gray-500">Did not use</span>
                                                <div className="flex space-x-1">
                                                    {[0, 1, 2, 3, 4, 5, 6, 7].map(value => (
                                                        <button
                                                            key={value}
                                                            type="button"
                                                            onClick={() => setChatbotHelpfulness(value.toString())}
                                                            className={`w-9 h-9 rounded-full text-sm font-bold transition-colors ${
                                                                chatbotHelpfulness === value.toString()
                                                                    ? 'bg-blue-600 text-white'
                                                                    : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                            }`}
                                                        >
                                                            {value}
                                                        </button>
                                                    ))}
                                                </div>
                                                <span className="text-xs text-gray-500">Extremely helpful</span>
                                            </div>
                                        </div>

                                        {hadMultimodal && (<>
                                        {/* Infographics */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-800 mb-2">
                                                How helpful were the infographics? *
                                            </label>
                                            <div className="flex items-center justify-between mt-3">
                                                <span className="text-xs text-gray-500">Did not use</span>
                                                <div className="flex space-x-1">
                                                    {[0, 1, 2, 3, 4, 5, 6, 7].map(value => (
                                                        <button
                                                            key={value}
                                                            type="button"
                                                            onClick={() => setInfographicHelpfulness(value.toString())}
                                                            className={`w-9 h-9 rounded-full text-sm font-bold transition-colors ${
                                                                infographicHelpfulness === value.toString()
                                                                    ? 'bg-blue-600 text-white'
                                                                    : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                            }`}
                                                        >
                                                            {value}
                                                        </button>
                                                    ))}
                                                </div>
                                                <span className="text-xs text-gray-500">Extremely helpful</span>
                                            </div>
                                        </div>

                                        {/* Video */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-800 mb-2">
                                                How helpful was the video? *
                                            </label>
                                            <div className="flex items-center justify-between mt-3">
                                                <span className="text-xs text-gray-500">Did not use</span>
                                                <div className="flex space-x-1">
                                                    {[0, 1, 2, 3, 4, 5, 6, 7].map(value => (
                                                        <button
                                                            key={value}
                                                            type="button"
                                                            onClick={() => setVideoHelpfulness(value.toString())}
                                                            className={`w-9 h-9 rounded-full text-sm font-bold transition-colors ${
                                                                videoHelpfulness === value.toString()
                                                                    ? 'bg-blue-600 text-white'
                                                                    : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                            }`}
                                                        >
                                                            {value}
                                                        </button>
                                                    ))}
                                                </div>
                                                <span className="text-xs text-gray-500">Extremely helpful</span>
                                            </div>
                                        </div>

                                        {/* Podcast */}
                                        <div>
                                            <label className="block text-sm font-bold text-gray-800 mb-2">
                                                How helpful was the podcast? *
                                            </label>
                                            <div className="flex items-center justify-between mt-3">
                                                <span className="text-xs text-gray-500">Did not use</span>
                                                <div className="flex space-x-1">
                                                    {[0, 1, 2, 3, 4, 5, 6, 7].map(value => (
                                                        <button
                                                            key={value}
                                                            type="button"
                                                            onClick={() => setPodcastHelpfulness(value.toString())}
                                                            className={`w-9 h-9 rounded-full text-sm font-bold transition-colors ${
                                                                podcastHelpfulness === value.toString()
                                                                    ? 'bg-blue-600 text-white'
                                                                    : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                            }`}
                                                        >
                                                            {value}
                                                        </button>
                                                    ))}
                                                </div>
                                                <span className="text-xs text-gray-500">Extremely helpful</span>
                                            </div>
                                        </div>
                                        </>)}
                                    </div>
                                </div>


                                {/* Section 5: Customization -- customising arms only */}
                                {canCustomize && customMade !== null && (
                                <div className="border-b pb-6">
                                    <h2 className="text-xl font-bold text-gray-800 mb-2">Section 5. Customized Content</h2>
                                    {usedCustom ? (
                                        <>
                                            <p className="text-sm text-gray-600 mb-4">You made your own version of the {customMade.map(m => m === 'audio' ? 'audio overview' : m === 'video' ? 'video overview' : 'infographic').join(', ')}. Please rate your agreement with the following statements.</p>
                                            <div className="space-y-8">
                                                {CUSTOM_ITEMS.map(item => (
                                                    <div key={item.key}>
                                                        <label className="block text-sm font-bold text-gray-800 mb-2">{item.text} *</label>
                                                        <div className="flex items-center justify-between mt-3">
                                                            <span className="text-xs text-gray-500">Strongly disagree</span>
                                                            <div className="flex space-x-1">
                                                                {[1, 2, 3, 4, 5, 6, 7].map(value => (
                                                                    <button
                                                                        key={value}
                                                                        type="button"
                                                                        onClick={() => setCustomAnswers(prev => ({ ...prev, [item.key]: value.toString() }))}
                                                                        className={`w-10 h-10 rounded-full text-sm font-bold transition-colors ${
                                                                            customAnswers[item.key] === value.toString()
                                                                                ? 'bg-blue-600 text-white'
                                                                                : 'bg-white border border-gray-300 text-gray-700 hover:bg-gray-100'
                                                                        }`}
                                                                    >
                                                                        {value}
                                                                    </button>
                                                                ))}
                                                            </div>
                                                            <span className="text-xs text-gray-500">Strongly agree</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <div>
                                            <label className="block text-sm font-bold text-gray-800 mb-2">
                                                You did not make your own version of the video, audio or infographic. Why not? (Optional)
                                            </label>
                                            <textarea
                                                value={customWhyNot}
                                                onChange={(e) => setCustomWhyNot(e.target.value)}
                                                rows="3"
                                                className="w-full p-3 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500"
                                            />
                                        </div>
                                    )}
                                </div>
                                )}

                                {/* Submit */}
                                <div className="flex justify-end pt-6">
                                    <button
                                        type="submit"
                                        disabled={isSubmitting}
                                        className="px-8 py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition-colors disabled:bg-green-400 disabled:cursor-not-allowed flex items-center justify-center"
                                    >
                                        {isSubmitting ? (
                                            <>
                                                <svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                                                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                                </svg>
                                                Submitting...
                                            </>
                                        ) : (
                                            'Next →'
                                        )}
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<Survey />, document.getElementById('root'));
    </script>

</body>
</html>
